services:
  - type: web
    name: hyrox
    runtime: static
    buildCommand: node build.js
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-store
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
