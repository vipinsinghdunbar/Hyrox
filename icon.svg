<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium dark navy background -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f1419; }
        .accent { fill: #ffd700; }
        .icon-symbol { fill: #ffffff; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .accent { fill: #d4af37; }
        .icon-symbol { fill: #0f1419; }
      }
    </style>
  </defs>

  <!-- Main background -->
  <rect class="bg" width="192" height="192" rx="45"/>

  <!-- Gold accent bar (premium accent) -->
  <rect class="accent" x="0" y="144" width="192" height="48" rx="45"/>

  <!-- Minimal stopwatch icon (fitness essence) -->
  <g class="icon-symbol">
    <!-- Circle outline -->
    <circle cx="96" cy="80" r="40" fill="none" stroke="currentColor" stroke-width="3"/>

    <!-- Top button -->
    <rect x="88" y="24" width="16" height="12" rx="2"/>

    <!-- Hand pointing to 3 (main hand) -->
    <line x1="96" y1="80" x2="128" y2="80" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

    <!-- Second hand (shorter) -->
    <line x1="96" y1="80" x2="96" y2="48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
