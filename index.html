  </div>
  <div class="rail" id="wkRail"></div>
  <div class="wk-body" id="wkBody"></div>
  <div class="wk-ft" id="wkFoot"></div>
</div>
<script>
/* =====================================================================
   WORKOUT MODE — block-based, auto-advancing, skippable rest
   ===================================================================== */
let W=null;          // active workout session
let wkTick=null;     // interval handle
let wakeLock=null;

const REST={sledPush:120,sledPull:120,deadlift:150,squat:150,frontsq:150,ohp:120,row_bb:120,
            rdl:120,thruster:120,pullup:90,kbswing:90,_round:180,_default:90};
function restFor(k){ return REST[k]!=null?REST[k]:REST._default; }

/* build the block list for a plan */
function buildBlocks(plan){
  const rounds = plan.half?1:1;
  const blocks=[];
  // seen counter lets the same exercise appear several times in one round
  const seen={};
  for(let r=1;r<=rounds;r++){
    plan.ex.forEach((k,i)=>{
      seen[k]=(seen[k]||0)+1;
      blocks.push({k, round:r, rounds, rep:seen[k], last:(i===plan.ex.length-1)});
    });
  }
  return blocks;
}

async function wkStart(){
  const plan=dayPlan(new Date());
  if(!plan.ex.length){ toast('Rest day — nothing scheduled'); return; }
  W={plan, blocks:buildBlocks(plan), i:0, phase:'work', t0:Date.now(), startedAt:Date.now(),
     results:{}, splits:{}, restEnd:0};
  document.getElementById('wk').classList.add('on');
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  if(wkTick)clearInterval(wkTick);
  wkTick=setInterval(wkFrame,100);
  wkRender();
}
function wkQuit(){
  if(W && W.i>0 && W.phase!=='summary'){
    if(!confirmQuit()) return;
  }
  wkClose();
}
let _quitArmed=false;
function confirmQuit(){
  if(_quitArmed){ _quitArmed=false; return true; }
  _quitArmed=true; toast('Tap × again to discard this session');
  setTimeout(()=>_quitArmed=false,3000);
  return false;
}
function wkClose(){
  document.getElementById('wk').classList.remove('on','rest','done');
  if(wkTick){clearInterval(wkTick);wkTick=null;}
  try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){}
  W=null; _quitArmed=false; render();
}

function wkFrame(){
  if(!W)return;
  const el=document.getElementById('wkElapsed');
  if(el) el.textContent=fmt(Math.floor((Date.now()-W.startedAt)/1000),'time');
  if(W.phase==='work'){
    const s=(Date.now()-W.t0)/1000;
    const tv=document.getElementById('wkTime');
    if(tv){
      tv.textContent=fmt(Math.floor(s),'time');
      const b=W.blocks[W.i], t=targetOf(b.k);
      if(EX[b.k].dir==='lower') tv.className='wk-time '+(s<=t?'ok':'over');
    }
  } else if(W.phase==='rest'){
    const left=Math.max(0,Math.ceil((W.restEnd-Date.now())/1000));
    const tv=document.getElementById('wkTime');
    if(tv) tv.textContent=fmt(left,'time');
    if(left<=0) wkNext();
  }
}

/* finish current station, record the time */
function wkDone(){
  if(!W||W.phase!=='work')return;
  const b=W.blocks[W.i];
  const secs=Math.round((Date.now()-W.t0)/1000);
  const e=EX[b.k];
  if(e.kind==='time'){
    // record every occurrence; store the best as the session result
    (W.splits[b.k]=W.splits[b.k]||[]).push(secs);
    const cur=W.results[b.k];
    W.results[b.k] = cur==null?secs:(e.dir==='lower'?Math.min(cur,secs):Math.max(cur,secs));
  } else {
    W.pendingKey=b.k; W.pendingSecs=secs; wkRenderEntry(); return;
  }
  wkAfterStation();
}
function wkAfterStation(){
  const b=W.blocks[W.i];
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  const dur = restFor(b.k);
  W.phase='rest'; W.restEnd=Date.now()+dur*1000; W.restFrom=Date.now();
  wkRender();
}
function wkNext(){
  if(!W)return;
  // bank the real transition time (Roxzone) — what actually elapsed, not what was scheduled
  if(W.phase==='rest' && W.restFrom && W.plan.half){
    W.rox=(W.rox||0)+Math.round((Date.now()-W.restFrom)/1000);
    W.restFrom=0;
  }
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  W.i++; W.phase='work'; W.t0=Date.now(); wkRender();
}
function wkSkipStation(){
  if(!W)return;
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  W.i++; W.phase='work'; W.t0=Date.now(); wkRender();
}
/* reps/kg entry mid-workout */
function wkRenderEntry(){
  const k=W.pendingKey, e=EX[k];
  document.getElementById('wk').className='on';
  document.getElementById('wkTitle').textContent=W.plan.n;
  document.getElementById('wkStep').textContent='Enter result';
  document.getElementById('wkRail').innerHTML=railHTML();
  document.getElementById('wkBody').innerHTML=`
  <div class="wk-kick">Station complete</div>
  <div class="wk-name">${e.n}</div>
  <div class="wk-sub">Took ${fmt(W.pendingSecs,'time')}. Enter what you actually did.</div>
  <div style="width:100%;max-width:300px">
    <div class="inrow"><input type="number" inputmode="decimal" step="any" id="wkIn" placeholder="${e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps'}" style="text-align:center;font-size:24px;font-weight:800;padding:16px">
    <div class="unit">${e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps'}</div></div>
    <div style="text-align:center;font-weight:600;font-size:11.5px;line-height:1;color:var(--muted);margin-top:11px">Target ${fmt(targetOf(k),e.kind)}</div>
  </div>`;
  document.getElementById('wkFoot').innerHTML=`<button class="btn" onclick="wkSaveEntry()">Confirm</button>`;
  setTimeout(()=>{const i=document.getElementById('wkIn');if(i)i.focus();},200);
}
function wkSaveEntry(){
  const k=W.pendingKey, e=EX[k];
  const v=parseVal(document.getElementById('wkIn').value,e.kind);
  if(v==null||v<=0){ toast('Enter a number'); return; }
  const cur=W.results[k];
  W.results[k]= cur==null?v:(e.dir==='lower'?Math.min(cur,v):Math.max(cur,v));
  W.pendingKey=null; wkAfterStation();
}

function railHTML(){
  return W.blocks.map((b,i)=>`<i class="${i<W.i?'done':i===W.i?'now':''}"></i>`).join('');
}

function wkRender(){
  if(!W)return;
  const wkEl=document.getElementById('wk');
  const body=document.getElementById('wkBody'), foot=document.getElementById('wkFoot');
  document.getElementById('wkRail').innerHTML=railHTML();

  /* ---------- SUMMARY ---------- */
  if(W.phase==='summary'){
    wkEl.className='on done';
    document.getElementById('wkTitle').textContent=W.plan.n;
    document.getElementById('wkStep').textContent='Complete';
    if(W.plan.half && W.rox>0 && W.results.roxzone==null) W.results.roxzone=W.rox;
    const ks=Object.keys(W.results);
    const hits=ks.filter(k=>isHit(k,W.results[k])).length;
    const total=Math.round((Date.now()-W.startedAt)/1000);
    body.innerHTML=`
    <div class="wk-kick" style="color:var(--green)">Session complete</div>
    <div class="wk-name">${hits}<span style="color:var(--muted)">/${ks.length}</span> hit</div>
    <div class="wk-sub">${fmt(total,'time')} total · ${W.plan.n}</div>
    <div class="wk-list">${ks.map(k=>{
      const v=W.results[k],h=isHit(k,v);
      const sp=W.splits[k];
      return `<div class="wk-li"><div class="dot ${h?'g':'r'}"></div>
      <div class="wk-li-n">${EX[k].n}${sp&&sp.length>1?`<div style="font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px">${sp.map(s=>fmt(s,'time')).join(' · ')}</div>`:''}</div>
      <div class="wk-li-v" style="color:${h?'var(--green)':'var(--red)'}">${fmt(v,EX[k].kind)}</div></div>`;
    }).join('')}</div>`;
    foot.innerHTML=`<button class="btn" onclick="wkSave()">Save session</button>
    <button class="btn gh sm" onclick="wkClose()">Discard</button>`;
    return;
  }

  const b=W.blocks[W.i], e=EX[b.k];

  /* ---------- REST ---------- */
  if(W.phase==='rest'){
    wkEl.className='on rest';
    const nb=W.blocks[W.i+1];
    document.getElementById('wkTitle').textContent=W.plan.n;
    document.getElementById('wkStep').textContent='Rest';
    body.innerHTML=`
    <div class="wk-kick">Rest</div>
    <div class="wk-time" id="wkTime">${fmt(Math.max(0,Math.ceil((W.restEnd-Date.now())/1000)),'time')}</div>
    <div class="wk-vs">Next up</div>
    <div class="wk-name" style="font-size:22px">${EX[nb.k].n}</div>
    <div class="wk-sub">Station ${W.i+2} of ${W.blocks.length} · Target ${fmt(targetOf(nb.k),EX[nb.k].kind)}${EX[nb.k].load?' @ '+EX[nb.k].load+' '+EX[nb.k].loadUnit:''}</div>`;
    if(W.plan.half){
      body.innerHTML+=`<div class="prevsplit" style="margin-top:20px">Roxzone so far: <b>${fmt(W.rox||0,'time')}</b><br><span style="font-size:10.5px">Transitions cost the average athlete 6:34 on race day.</span></div>`;
    }
    foot.innerHTML=`<button class="btn" onclick="wkNext()">Skip rest · start now</button>
    <button class="btn gh sm" onclick="W.restEnd+=30000">+30 sec</button>`;
    return;
  }

  /* ---------- WORK ---------- */
  wkEl.className='on';
  document.getElementById('wkTitle').textContent=W.plan.n;
  document.getElementById('wkStep').textContent=`Station ${W.i+1} of ${W.blocks.length}`;

  const t=targetOf(b.k);
  let prev='';
  const sp=W.splits[b.k];
  if(sp && sp.length){
    const ls=sp[sp.length-1];
    prev=`<div class="prevsplit">Your rep ${sp.length} this session: <b>${fmt(ls,'time')}</b></div>`;
  } else {
    const lo=latestOf(b.k);
    if(lo!=null) prev=`<div class="prevsplit">Last session: <b>${fmt(lo,EX[b.k].kind)}</b></div>`;
  }

  body.innerHTML=`
  ${W.blocks.length>5?`<div class="rounds">${W.blocks.map((bb,ix)=>
    `<div class="rd ${ix<W.i?'done':ix===W.i?'now':''}" style="width:26px;height:26px;font-size:11px">${ix+1}</div>`
    ).slice(Math.max(0,Math.min(W.i-2,W.blocks.length-5)),Math.max(5,Math.min(W.i+3,W.blocks.length))).join('')}</div>`:''}
  <div class="wk-kick">${GRP[e.grp].n}</div>
  <div class="wk-name">${e.n}</div>
  <div class="wk-sub">${e.load?`${e.load} ${e.loadUnit} · `:''}${e.note||W.plan.brief}</div>
  <div class="wk-time" id="wkTime">0:00</div>
  <div class="wk-vs">Target <b>${fmt(t,e.kind)}</b></div>
  ${prev}`;
  foot.innerHTML=`<button class="btn" onclick="wkDone()">Finish station</button>
  <button class="btn gh sm" onclick="wkSkipStation()">Skip</button>`;
}

function wkSave(){
  const key=todayKey();
  const ex=S.logs.find(l=>l.date===key);
  if(ex){ ex.results=Object.assign(ex.results||{},W.results); ex.name=W.plan.n; }
  else S.logs.push({date:key, week:weekNo(), name:W.plan.n, results:Object.assign({},W.results)});
  save();
  const ks=Object.keys(W.results), hits=ks.filter(k=>isHit(k,W.results[k])).length;
  wkClose();
  toast(`Saved · ${hits}/${ks.length} target${ks.length===1?'':'s'} hit`);
}
</script>
</body>
</html>
