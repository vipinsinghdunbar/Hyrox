<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<meta name="theme-color" content="#0f1419">
<meta name="app-version" content="dev">
<title>Hyrox</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230f1419'/%3E%3Cg fill='%23ffd700'%3E%3Crect x='150' y='148' width='46' height='216' rx='10'/%3E%3Crect x='316' y='148' width='46' height='216' rx='10'/%3E%3Crect x='150' y='233' width='212' height='46' rx='10'/%3E%3C/g%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--navy:#0f1419;--card:#1a2332;--card2:#212d3f;--border:#2a3a52;
--gold:#ffd700;--gold-d:#e6c200;--white:#fff;--muted:#8b97a8;--muted2:#b0b8c4;
--green:#20a676;--red:#ef4444;--amber:#f59e0b;--blue:#38bdf8;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
html{-webkit-text-size-adjust:100%}
body{
font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
background:var(--navy);color:var(--white);
overscroll-behavior-y:none;
-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:min(var(--sat),60px);background:var(--navy);z-index:40}
/* ====== APPLE-STYLE SCROLLING ====== */
.scroll{
flex:1;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;
scroll-behavior:smooth;
scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}
.snap{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overflow-x:auto;scrollbar-width:none}
.snap::-webkit-scrollbar{display:none}
.snap>*{scroll-snap-align:start}

#app{
/* Pin to the viewport with inset:0 and let the fixed position define the box.
   height:100dvh is NOT used: in iOS standalone mode dvh can under-report by the
   bottom safe-area inset, which leaves dead space below the tab bar. */
display:flex;flex-direction:column;
position:fixed;top:0;left:0;right:0;bottom:0;
height:auto;
}

/* ====== LARGE TITLE HEADER (iOS style) ====== */
.hdr{
/* Clamp the top inset the same way: a large reported value should not push
   the title halfway down the screen. */
padding:calc(min(var(--sat),60px) + 10px) max(18px,var(--sal)) 10px max(18px,var(--sar));
background:rgba(15,20,25,.86);
backdrop-filter:saturate(180%) blur(20px);
-webkit-backdrop-filter:saturate(180%) blur(20px);
border-bottom:.5px solid transparent;
transition:border-color .25s, padding .25s;
position:relative;z-index:30;flex-shrink:0;
}
.hdr.stuck{border-bottom-color:var(--border)}
.hdr-sm{font-size:12px;color:var(--muted);letter-spacing:.3px}
.hdr-lg{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin-top:1px;transition:font-size .25s}
.hdr.stuck .hdr-lg{font-size:21px}
.hdr.stuck .hdr-sm{display:none}

.wrap{padding:16px max(18px,var(--sal)) 24px max(18px,var(--sar))}

/* ====== TAB BAR ====== */
.tabbar{
display:flex;flex-shrink:0;
background:rgba(15,20,25,.92);
backdrop-filter:saturate(180%) blur(20px);
-webkit-backdrop-filter:saturate(180%) blur(20px);
border-top:.5px solid var(--border);
/* The bottom inset is the home-indicator strip. Clamp it so a large reported
   inset cannot inflate the bar; 6px floor keeps it comfortable with no inset. */
padding:7px max(6px,var(--sal)) max(6px,min(var(--sab),20px)) max(6px,var(--sar));
position:relative;z-index:30;
}
.tab{
flex:1;background:none;border:none;color:var(--muted);
display:flex;flex-direction:column;align-items:center;gap:3px;
padding:4px 2px;cursor:pointer;font-weight:600;font-size:10px;line-height:1;letter-spacing:.2px;
transition:color .18s;
}
.tab svg{width:25px;height:25px;stroke-width:1.9}
.tab.on{color:var(--gold)}
.tab:active{opacity:.55}

/* ====== CARDS ====== */
.card{background:var(--card);border:.5px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.card-t{font-weight:800;font-size:11px;line-height:1;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.sec{font-weight:800;font-size:12px;line-height:1;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:26px 0 11px;padding:0 2px}
.sec:first-child{margin-top:4px}

/* hero */
.hero{
background:
radial-gradient(120% 120% at 100% 0%,rgba(255,215,0,.13) 0%,transparent 55%),
linear-gradient(160deg,var(--card2) 0%,var(--card) 100%);
border:.5px solid var(--border);border-radius:22px;padding:19px;margin-bottom:14px;position:relative;overflow:hidden;
}
.hero-k{font-weight:800;font-size:10px;line-height:1;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.hero-h{font-size:26px;font-weight:800;letter-spacing:-.75px;line-height:1.12}
.hero-s{font-size:13px;color:var(--muted2);margin-top:7px;line-height:1.5}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;
padding-top:15px;border-top:.5px solid rgba(255,255,255,.09)}
.hero-row.pills{display:flex;gap:7px;border-top:none;padding-top:0;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:5px;min-width:0}
.chip em{font-weight:800;font-size:19px;line-height:1;font-style:normal;letter-spacing:-.7px;color:var(--white)}
.chip span{font-weight:600;font-size:8.5px;line-height:1.2;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.g em{color:var(--gold)}
.hero-row.pills .chip{
flex-direction:row;background:rgba(255,255,255,.07);border:.5px solid var(--border);
border-radius:100px;padding:5px 11px;font-weight:600;font-size:11px;line-height:1.3;color:var(--muted2);gap:0;
}

/* buttons */
.btn{
background:var(--gold);color:#0f1419;border:none;border-radius:14px;
padding:15px;font-weight:800;font-size:15px;line-height:1;letter-spacing:-.1px;width:100%;cursor:pointer;
transition:transform .12s,opacity .12s;
}
.btn:active{transform:scale(.975);opacity:.88}
.btn.alt{background:var(--card2);color:var(--white);border:.5px solid var(--border)}
.btn.sm{padding:13px 11px;min-height:44px;font-size:13px;border-radius:11px}
.btn.gh{background:transparent;border:1px solid var(--border);color:var(--muted2)}

/* stat grid — 2-up keeps labels on one line */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.sgrid.c3{grid-template-columns:repeat(3,1fr)}
.stat{
background:var(--card);border:.5px solid var(--border);border-radius:16px;
padding:15px 10px 13px;text-align:center;min-width:0;
}
.stat-v{font-size:26px;font-weight:800;letter-spacing:-1.1px;color:var(--gold);line-height:1;white-space:nowrap}
.stat-v.sm{font-size:21px;letter-spacing:-.8px}
.stat-v.w{color:var(--white)}
.stat-v.g{color:var(--green)}
.stat-v.r{color:var(--red)}
.stat-v u{font-size:12px;font-weight:700;text-decoration:none;letter-spacing:0;opacity:.75}
.stat-v s{font-size:13px;font-weight:700;text-decoration:none;color:var(--muted);letter-spacing:0}
.stat-l{
font-weight:600;font-size:9px;line-height:1.2;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* rows */
.row{
display:flex;align-items:center;gap:11px;
background:var(--card);border:.5px solid var(--border);border-radius:15px;
padding:13px 14px;margin-bottom:8px;cursor:pointer;
transition:transform .12s,background .15s;
}
.row:active{transform:scale(.985);background:var(--card2)}
.row.lead{border-left:2.5px solid var(--gold);border-radius:4px 15px 15px 4px}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;font-size:14.5px;line-height:1.3;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;flex-shrink:0}
.row-v{font-weight:800;font-size:15px;line-height:1;color:var(--gold);letter-spacing:-.3px;white-space:nowrap}
.row-vs{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.caret{width:7px;height:12px;flex-shrink:0;opacity:.3}
.gtitle{
display:flex;align-items:center;gap:8px;
font-weight:800;font-size:10.5px;line-height:1;letter-spacing:1.1px;text-transform:uppercase;
margin:22px 0 10px;padding:0 2px;
}
.gtitle i{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.gtitle b{margin-left:auto;font-weight:600;font-size:10px;line-height:1;color:var(--muted);letter-spacing:.4px;text-transform:none}

/* ===== session history ===== */
.histrow{display:flex;align-items:center;gap:11px;
background:var(--card);border:.5px solid var(--border);border-radius:14px;
padding:13px 14px;margin-bottom:8px;cursor:pointer}
.histrow:active{background:var(--card2)}
.setsline{font-weight:600;font-size:11.5px;line-height:1.6;color:var(--muted2);
padding:3px 0;font-variant-numeric:tabular-nums}
.setsline b{color:var(--muted);font-weight:700;margin-right:6px}

/* ===== set dots on the workout screen ===== */
.setdots{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
margin:0 auto 16px;max-width:330px}
.sdot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);
background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:11px;line-height:1;flex-shrink:0}
.sdot.on{background:rgba(32,166,118,.2);border-color:var(--green);color:var(--green)}
.setdots-l{width:100%;text-align:center;font-weight:700;font-size:10.5px;
letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-top:3px}
/* a finished set keeps its number but reads as done */
.sdot.done{background:rgba(32,166,118,.14);border-color:rgba(32,166,118,.5);color:var(--green)}
/* the set you are currently viewing */
.sdot.cur{border-color:var(--yellow);color:var(--yellow);background:rgba(250,204,21,.12);
transform:scale(1.14)}
.sdot{cursor:pointer;transition:transform .15s,border-color .15s,background .15s}

/* ===== set tabs + panel (workout screen) =====
   A tab bar names the sets; the panel below swipes between them. */
.settabs{display:flex;gap:4px;width:100%;max-width:330px;margin:0 auto 9px;
background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:3px}
.stab{flex:1;border:none;background:transparent;color:var(--muted);
font-weight:700;font-size:11.5px;letter-spacing:.2px;line-height:1;
padding:15px 4px;min-height:44px;border-radius:9px;cursor:pointer;white-space:nowrap;
display:flex;align-items:center;justify-content:center;gap:5px;
transition:background .18s,color .18s}
.stab .tk{font-size:9px;line-height:1}
.stab.done{color:var(--green)}
.stab.sel{background:var(--card);color:var(--fg);
box-shadow:0 1px 3px rgba(0,0,0,.35)}
.stab.sel.done{color:var(--green)}
.stab.live:not(.sel){color:var(--yellow)}

.setpager{position:relative;width:100%;max-width:330px;margin:0 auto 12px;
overflow-x:hidden;overflow-y:visible;touch-action:pan-y;
-webkit-user-select:none;user-select:none}
.sptrack{display:flex;will-change:transform;
transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.sptrack.drag{transition:none}
.setpage{flex:0 0 100%;box-sizing:border-box;
border:1px solid var(--border);border-radius:14px;background:var(--card);
padding:13px 15px;min-height:84px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:4px;
transition:opacity .22s,border-color .2s,background .2s}
.setpage.off{opacity:.5}
.setpage.isnow{border-color:var(--yellow);background:rgba(250,204,21,.06)}
.setpage.isdone{border-color:rgba(32,166,118,.45)}
.sp-h{font-weight:800;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
color:var(--muted)}
.setpage.isnow .sp-h{color:var(--yellow)}
.setpage.isdone .sp-h{color:var(--green)}
.sp-big{font-weight:800;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.sp-sub{font-weight:600;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.sp-w{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:2px}
.sp-w button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
background:var(--bg2);color:var(--fg);font-weight:800;font-size:19px;line-height:1;cursor:pointer}
.sp-w input{width:78px;min-height:46px;text-align:center;font-weight:800;font-size:19px;padding:7px 4px;
border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);
font-variant-numeric:tabular-nums}
.sp-w .u{font-weight:700;font-size:12px;color:var(--muted)}

/* ===== form notes: a button until you want them ===== */
.cuebtn{display:block;margin:0 auto 14px;padding:8px 16px;border-radius:999px;
border:1px solid var(--border);background:transparent;color:var(--muted);
font-weight:700;font-size:11px;letter-spacing:.4px;cursor:pointer}
.cuebtn:active{background:var(--bg2)}
.cuebox{position:relative;max-width:330px;margin:0 auto 14px;padding:11px 32px 11px 14px;
background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.22);border-radius:13px;
font-size:11.5px;line-height:1.55;color:var(--muted2);text-align:left}
.cuebox b{color:var(--blue)}
.cueclose{position:absolute;top:0;right:0;width:44px;height:44px;border:none;
background:transparent;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;
display:flex;align-items:flex-start;justify-content:flex-end;padding:6px 8px 0 0}

/* ===== per-set logging ===== */
.sets{display:flex;flex-direction:column;gap:7px}
.setrow{display:flex;align-items:center;gap:9px}
.settick{flex:0 0 36px;height:44px;border-radius:11px;border:1px solid var(--border);
background:var(--navy);color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;
transition:all .15s;line-height:1}
.settick.on{background:rgba(32,166,118,.18);border-color:var(--green);color:var(--green)}
.settick:active{transform:scale(.94)}
.setrow input{flex:1;min-width:0}
.setunit{flex:0 0 44px;text-align:center;font-weight:700;font-size:11px;color:var(--muted)}
.setsdone{font-weight:700;font-size:11.5px;color:var(--muted);text-align:center;
padding-top:4px;letter-spacing:.2px}
.setsdone.done{color:var(--green)}

/* ===== machine settings ===== */
.machbox{background:var(--navy);border:1px solid var(--border);border-radius:12px;
margin-bottom:10px;overflow:hidden}
.machhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
padding:11px 13px;cursor:pointer}
.machhead>span:first-child{font-weight:700;font-size:12.5px;color:var(--muted2)}
.machsum{font-weight:700;font-size:11.5px;color:var(--blue);text-align:right;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.machfields{padding:2px 13px 13px;border-top:.5px solid var(--border)}
.machrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.machrow label{flex:1;min-width:0;font-weight:600;font-size:12px;color:var(--muted2);line-height:1.3}
.machrow label em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}
.machrow input{flex:0 0 88px;text-align:center;padding:10px}
.machnote{font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:11px}

/* ===== prescription (sets x reps) ===== */
.rxline{font-weight:700;font-size:11.5px;line-height:1.35;color:var(--gold);margin-top:4px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxbox{background:rgba(255,215,0,.09);border:1px solid rgba(255,215,0,.26);border-radius:11px;
padding:9px 12px;margin-bottom:9px;font-weight:700;font-size:12.5px;line-height:1.4;color:var(--gold)}
.rxbig{max-width:330px;margin:0 auto 14px;background:rgba(255,215,0,.1);
border:1px solid rgba(255,215,0,.28);border-radius:13px;padding:11px 15px;
font-weight:800;font-size:14px;line-height:1.4;color:var(--gold);text-align:center}

/* ===== progress summary rows ===== */
.prow{display:flex;align-items:center;gap:10px;
background:var(--card);border:.5px solid var(--border);border-radius:14px;
padding:12px 13px;margin-bottom:7px;cursor:pointer;transition:background .15s,border-radius .15s}
.prow:active{background:var(--card2)}
.prow.open{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;border-bottom-color:transparent}
.prow-n{flex:1;min-width:0}
.prow-v{text-align:right;flex-shrink:0;min-width:52px}
.prow-t{flex-shrink:0;min-width:58px;text-align:right}
.pexp{border-top-left-radius:0;border-top-right-radius:0;margin-top:0;border-top:none}

/* ===== week strip ===== */
.wnav{display:flex;align-items:center;justify-content:space-between;
padding:0 14px 10px;gap:10px}
.wnav span{font-weight:800;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.wnav button{background:var(--card2);border:.5px solid var(--border);color:var(--muted2);
width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;flex-shrink:0}
.wnav button:active{opacity:.6}
.wrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
scroll-snap-type:x proximity;scrollbar-width:none;padding:0 12px}
.wrow::-webkit-scrollbar{display:none}
.wcell{flex:0 0 46px;scroll-snap-align:center;text-align:center;
padding:9px 3px 8px;border-radius:12px;border:1px solid transparent;min-width:0}
.wcell.now{border-color:var(--gold);background:rgba(255,215,0,.07)}
.wdow{font-weight:800;font-size:10px;letter-spacing:.4px;color:var(--muted2);text-transform:uppercase}
.wcell.now .wdow{color:var(--gold)}
.wdate{font-weight:700;font-size:13px;margin-top:2px;color:var(--white)}
.wdot{width:19px;height:19px;border-radius:50%;margin:7px auto 0;
display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;line-height:1}
.wdot.g{background:rgba(32,166,118,.2);color:var(--green)}
.wdot.a{background:rgba(255,215,0,.2);color:var(--gold)}
.wdot.r{background:rgba(239,68,68,.16);color:var(--red)}
.wdot.b{background:rgba(56,189,248,.18);color:var(--blue)}
.wdot.m{background:rgba(255,255,255,.06);color:var(--muted)}
.wname{font-size:8.5px;line-height:1.25;color:var(--muted);margin-top:6px;
overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wcell.now .wname{color:var(--muted2)}

.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.dot.a{background:var(--amber)}.dot.m{background:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:4px 9px;font-weight:700;font-size:10.5px;line-height:1.3;letter-spacing:.2px}
.pill.g{background:rgba(32,166,118,.16);color:var(--green)}
.pill.r{background:rgba(239,68,68,.16);color:var(--red)}
.pill.a{background:rgba(245,158,11,.16);color:var(--amber)}
.pill.m{background:rgba(255,255,255,.07);color:var(--muted)}

/* coach */
.coach{
background:linear-gradient(145deg,rgba(255,215,0,.10) 0%,rgba(255,215,0,.03) 100%);
border:.5px solid rgba(255,215,0,.22);border-radius:18px;padding:16px;margin-bottom:12px;
}
.coach-t{font-weight:800;font-size:11px;line-height:1;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.coach-p{font-size:13.5px;line-height:1.58;color:var(--muted2);margin-bottom:9px}
.coach-p:last-child{margin-bottom:0}
.coach-p b{color:var(--white);font-weight:700}

/* charts */
.chart{width:100%;height:132px;display:block;overflow:visible}
.chart-hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.chart-v{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.chart-l{font-weight:600;font-size:10px;line-height:1;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2.5px;gap:2px;margin-bottom:14px}
.seg button{
flex:1;background:none;border:none;color:var(--muted);border-radius:8px;
padding:7px 4px;font-weight:700;font-size:11.5px;line-height:1;cursor:pointer;transition:all .18s;
}
.seg button.on{background:var(--card);color:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* inputs */
.field{margin-bottom:14px}
.flabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.flabel span:first-child{font-weight:700;font-size:13.5px;line-height:1}
.flabel span:last-child{font-size:11px;color:var(--muted)}
.inrow{display:flex;gap:9px;align-items:stretch}
input,select{
flex:1;min-width:0;background:var(--navy);border:1px solid var(--border);border-radius:12px;
padding:13px 14px;color:var(--white);font-weight:600;font-size:16px;line-height:1;
-webkit-appearance:none;appearance:none;
}
input:focus,select:focus{outline:none;border-color:var(--gold)}
input::placeholder{color:#5a6678;font-weight:400}
.unit{
flex:0 0 52px;display:flex;align-items:center;justify-content:center;
background:var(--card2);border:1px solid var(--border);border-radius:12px;
font-weight:700;font-size:11.5px;line-height:1;color:var(--muted);
}
.fb{margin-top:9px;border-radius:12px;padding:11px 13px;font-weight:600;font-size:12.5px;line-height:1.45;text-align:center;background:var(--navy);border:1px solid var(--border);color:var(--muted)}
.fb.g{background:rgba(32,166,118,.13);border-color:rgba(32,166,118,.35);color:var(--green)}
.fb.r{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.35);color:var(--red)}
.fb.a{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.35);color:var(--amber)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
position:fixed;left:0;right:0;bottom:0;z-index:100;
background:var(--navy);border-top:.5px solid var(--border);
border-radius:22px 22px 0 0;max-height:92dvh;
display:flex;flex-direction:column;
transform:translateY(101%);transition:transform .36s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.grab{display:flex;justify-content:center;padding:9px 0 3px}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--border)}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;padding:6px max(18px,var(--sal)) 14px max(18px,var(--sar));border-bottom:.5px solid var(--border)}
.sheet-hd h3{font-size:19px;font-weight:800;letter-spacing:-.4px;flex:1}
.sheet-hd p{font-size:11.5px;color:var(--muted);margin-top:3px}
.x{background:var(--card2);border:none;color:var(--white);width:31px;height:31px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;line-height:1;position:relative}
/* the circle stays small; the tappable area is 44px */
.x::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(18px,var(--sal)) 0 max(18px,var(--sar))}
.sheet-ft{padding:12px max(18px,var(--sal)) calc(var(--sab) + 12px) max(18px,var(--sar));border-top:.5px solid var(--border);background:var(--navy)}

.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty b{display:block;color:var(--white);font-size:16px;margin-bottom:7px;font-weight:700}
.empty p{font-size:13px;line-height:1.6}

.bar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-d),var(--gold));transition:width .6s cubic-bezier(.32,.72,0,1)}
.bar i.g{background:linear-gradient(90deg,#17805a,var(--green))}
.bar i.r{background:linear-gradient(90deg,#b91c1c,var(--red))}

.hr{height:.5px;background:var(--border);margin:16px 0}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.hide{display:none!important}
.toast{
position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translateX(-50%) translateY(16px);
background:var(--card2);border:.5px solid var(--border);border-radius:13px;
padding:12px 19px;font-weight:700;font-size:13px;line-height:1;z-index:200;
opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.32,.72,0,1);
box-shadow:0 10px 32px rgba(0,0,0,.5);white-space:nowrap;max-width:90vw;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr">
    <div class="hdr-sm" id="hdrSm">Loading</div>
    <div class="hdr-lg" id="hdrLg">Hyrox</div>
  </div>
  <div class="scroll" id="scroll"><div class="wrap" id="view"></div></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"><i></i></div>
  <div class="sheet-hd"><div style="flex:1"><h3 id="shTitle">—</h3><p id="shSub"></p></div><button class="x" onclick="closeSheet()">&times;</button></div>
  <div class="sheet-bd" id="shBody"></div>
  <div class="sheet-ft" id="shFoot"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   HYROX — personal trainer engine
   Baselines are YOUR logged numbers. Race: March 2027.
   ===================================================================== */
const RACE = new Date('2027-03-01T09:00:00');
const PLAN_START = new Date('2026-10-21T00:00:00');   // Week 1 Mon 21 Oct 2026

/* ---- metric direction: 'lower' = faster/less is better, 'higher' = more is better ---- */
/* kind: 'time' (mm:ss) | 'reps' | 'kg' | 'dist' */

const EX = {
  /* ============ THE 8 HYROX RACE STATIONS + RUN + TRANSITIONS ============
     `rx` is the training prescription by block: [block1, block2, block3, block4+].
     It is what you actually DO in a session; `base`/target is the time or load
     you are chasing on one scored effort. */
  run1k:      {n:'1 km Run',            grp:'hyrox', kind:'time', dir:'lower', base:401, unit:'mm:ss', note:'Race pace anchor',
               rx:['3 × 6 min at threshold, 75 s jog','4 × 1 km at goal pace, 2 min','4 × 1 km at goal pace, 90 s','3 × 1 km at race pace, 2 min']},
  ski:        {n:'SkiErg 1000 m',       grp:'hyrox', kind:'time', dir:'lower', base:284, unit:'mm:ss', note:'500 m logged 2:22 → 1000 m est.',
               rx:['3 × 500 m, 90 s rest','4 × 500 m, 75 s rest','2 × 1000 m at race pace, 3 min','1 × 1000 m at race pace']},
  sledPush:   {n:'Sled Push 50 m',      grp:'hyrox', kind:'time', dir:'lower', base:78,  unit:'mm:ss', load:152, loadUnit:'kg',
               rx:['6 × 25 m moderate, 90 s rest','5 × 50 m at race weight, 2 min','3 × 25 m at 110–120% (167–182 kg), 3 min','2 × 50 m at race weight, 3 min'],
               cue:'Low hips, short fast steps, arms locked. Never stop once moving — restarting a sled costs more than slowing down.'},
  sledPull:   {n:'Sled Pull 50 m',      grp:'hyrox', kind:'time', dir:'lower', base:84,  unit:'mm:ss', load:103, loadUnit:'kg',
               rx:['5 × 25 m, 90 s rest','4 × 50 m at race weight, 2 min','3 × 50 m at race weight, 2 min','2 × 50 m at race weight, 3 min'],
               cue:'Hand over hand, sit back into it, drive through the heels. Grip fails before legs — that is why swings and rows are in the plan.'},
  burpee:     {n:'Burpee Broad Jump 80 m',grp:'hyrox',kind:'time',dir:'lower', base:297, unit:'mm:ss', note:'Open men field average 4:57', est:true,
               rx:['4 × 8 reps, 60 s rest','4 × 10 reps, 60 s rest','3 × 20 m, 90 s rest','2 × 20 m easy'],
               cue:'Jump less far, cycle faster. Broad jump distance is where people blow their heart rate.'},
  row:        {n:'Row 1000 m',          grp:'hyrox', kind:'time', dir:'lower', base:291, unit:'mm:ss', note:'Open men field average 4:51', est:true,
               rx:['3 × 500 m, 90 s rest','4 × 500 m, 75 s rest','2 × 1000 m at race pace, 3 min','1 × 1000 m at race pace'],
               cue:'Legs, back, arms — then reverse. Rate 24–26, not 30. Strap the feet tight before you start.'},
  farmers:    {n:'Farmers Carry 200 m', grp:'hyrox', kind:'time', dir:'lower', base:169, unit:'mm:ss', load:24, loadUnit:'kg ea', note:'Open men field average 2:49', est:true,
               rx:['4 × 40 m, 90 s rest','4 × 50 m, 90 s rest','3 × 100 m, 2 min','2 × 100 m at race weight'],
               cue:'Shoulders packed, ribs down, quick short steps. Do not let the bells swing — that is wasted grip.'},
  lunges:     {n:'Sandbag Lunges 100 m',grp:'hyrox', kind:'time', dir:'lower', base:335, unit:'mm:ss', load:20, loadUnit:'kg', note:'Open men field average 5:35', est:true,
               rx:['3 × 20 m, 90 s rest','4 × 25 m, 90 s rest','3 × 50 m, 2 min','2 × 25 m easy'],
               cue:'Back knee touches, front shin vertical. Bag high on the shoulders. Short steps are faster than long ones here.'},
  wallball:   {n:'Wall Balls 100 reps', grp:'hyrox', kind:'time', dir:'lower', base:420, unit:'mm:ss', load:6, loadUnit:'kg', note:'50 reps logged @ 3:30',
               rx:['3 × 20 reps, 60 s rest','4 × 25 reps, 60 s rest','2 × 50 reps, 2 min','3 × 20 reps easy'],
               cue:'Squat under it, use the legs to throw. Breathe at the top, not the bottom. Catch and go straight down.'},
  roxzone:    {n:'Roxzone (transitions)',grp:'hyrox',kind:'time', dir:'lower', base:394, unit:'mm:ss', note:'Total transition time. Field average 6:34 — more than most single stations.', est:true},

  /* ============ STRENGTH ============ */
  kbswing:    {n:'KB Swing 20 reps',    grp:'str',  kind:'kg',   dir:'higher', base:24,  unit:'kg', note:'Explosive hip hinge — drives sled pull and row.',
               rx:['3 × 15, 90 s rest','4 × 15, 90 s rest','4 × 12 heavier, 2 min','3 × 12 easy'],
               cue:'Hips snap back then forward. Arms stay loose — the bell floats, you never lift it. Shoulders down, ribs closed, spine neutral. If your lower back is working, you are squatting it, not hinging.'},
  squat:      {n:'Back Squat 5RM',      grp:'str',  kind:'kg',   dir:'higher', base:90,  unit:'kg', note:'Legs under fatigue — wall balls and lunges',
               rx:['4 × 8 at 70–75% (≈66–71 kg), 2 min','4 × 6 at 80% (≈76 kg), 2.5 min','4 × 4 at 85% (≈81 kg), 3 min','3 × 5 at 70%, 2 min'],
               cue:'Depth before load — hip crease below the knee. Knees track over toes, chest up, brace before you descend. Film one set from the side if a rep felt off.'},
  row_bb:     {n:'Bent-Over Row 8RM',   grp:'str',  kind:'kg',   dir:'higher', base:60,  unit:'kg', note:'Horizontal pull — sled pull',
               rx:['3 × 10, 1 s pause at top, 90 s','4 × 8, 1 s pause, 90 s','4 × 6 heavier, 2 min','3 × 8 easy'],
               cue:'Hinge to about 45 degrees and hold it — the torso does not rise as you pull. Elbows to the ribs, not flared. If the weight swings up, it is too heavy.'},
  ohp:        {n:'Overhead Press 5RM',  grp:'str',  kind:'kg',   dir:'higher', base:45,  unit:'kg', note:'Shoulders — wall balls and SkiErg',
               rx:['3 × 10, 90 s rest','4 × 8, 90 s rest','4 × 6 heavier, 2 min','3 × 8 easy'],
               cue:'Squeeze glutes and brace so the bar goes up, not your ribs. Head moves back then through at lockout. No leg drive — that is a push press.'},
  hipthrust:  {n:'Hip Thrust 10RM',     grp:'str',  kind:'kg',   dir:'higher', base:70,  unit:'kg', note:'Posterior chain with zero spinal loading',
               rx:['3 × 12, 90 s rest','3 × 15, 90 s rest','4 × 10 heavier, 2 min','3 × 10 easy'],
               cue:'Chin tucked, ribs down, squeeze at the top for a full second. Drive through the heels. Bench at the base of the shoulder blades.'},

  /* ============ LEGS & RUNNING DURABILITY ============
     Plantar flexor force is what protects running mechanics late in the race —
     elite Hyrox athletes sit around 18 N/kg. Calves are the biggest single gap
     in most amateur plans. */
  calfraise:  {n:'Soleus Calf Raise',   grp:'legs', kind:'reps', dir:'higher', base:12,  unit:'reps',
               note:'Plantar flexors — protects running in the back half',
               rx:['3 × 12 bodyweight, slow, 2 s pause','3 × 10 loaded, 2 s pause','3 × 8 heavier + 3 × 5 isometric 5 s holds','3 × 12 bodyweight'],
               cue:'Knee bent about 20 degrees to hit the soleus rather than the calf. Full range, pause at the top, lower slowly. Do these on a step.'},
  splitsq:    {n:'Split Squat 8/leg',   grp:'legs', kind:'kg',   dir:'higher', base:20,  unit:'kg ea',
               note:'Single leg — the sandbag lunge station',
               rx:['3 × 8 per leg, 90 s rest','3 × 10 per leg, 90 s','4 × 6 per leg heavier, 2 min','3 × 8 per leg easy'],
               cue:'Front shin vertical, back knee down to just above the floor. Torso upright. Control the lowering — that is where the strength is built.'},
  boxjump:    {n:'Box Jump 5 reps',     grp:'legs', kind:'reps', dir:'higher', base:5,   unit:'reps',
               note:'Leg stiffness and reactive strength',
               rx:['3 × 3, step down, 2 min','3 × 5, step down, 2 min','4 × 3 explosive, 2 min','skip — too much impact in taper'],
               cue:'Land soft and quiet on the box, knees out. Always step down, never jump down. Stop the set the moment height drops.'},

  /* ============ CORE & GRIP ============ */
  farmhold:   {n:'Farmers Hold',        grp:'core', kind:'time', dir:'higher', base:60, unit:'mm:ss', load:24, loadUnit:'kg ea',
               note:'Grip endurance',
               rx:['3 × 45 s, 60 s rest','3 × 60 s, 60 s rest','3 × 45 s heavier, 90 s','2 × 45 s'],
               cue:'Shoulders packed down, ribs closed. Squeeze the handle actively rather than hanging off it.'},
  plank:      {n:'Plank Hold',          grp:'core', kind:'time', dir:'higher', base:90, unit:'mm:ss',
               note:'Trunk under load',
               rx:['3 × 45 s, 45 s rest','3 × 60 s, 45 s rest','3 × 60 s weighted, 60 s','2 × 45 s'],
               cue:'Squeeze glutes, tuck the ribs, do not let the hips sag or pike. Quality beats duration.'},

  /* ============ CONDITIONING ============ */
  easyrun:    {n:'Easy Run',            grp:'cond', kind:'dist', dir:'higher', base:6,  unit:'km', note:'Aerobic base',
               rx:['30–45 min conversational','35–50 min conversational','30–45 min conversational','25–30 min very easy'],
               cue:'You should be able to speak in full sentences. If you cannot, slow down — this day is not meant to hurt.'},
};

const GRP = {
  hyrox:{n:'Hyrox Race Stations', c:'var(--gold)'},
  str:  {n:'Strength', c:'var(--blue)'},
  legs: {n:'Legs & Durability', c:'var(--green)'},
  core: {n:'Core & Grip', c:'var(--amber)'},
  cond: {n:'Conditioning', c:'var(--muted2)'},
};

/* ---------------- WEEKLY TEMPLATE (Mon/Wed/Fri full, Tue/Thu run) ---------------- */
const WK = {
  /* ===================================================================
     Two hard days. Running is ~58% of race time; stations ~35%.
     Sessions are built to genuinely fit 40 minutes — coaching sources
     suggest 45-90 min, so this is deliberately trimmed rather than
     a full programme squeezed in.
     =================================================================== */
  1:{n:'Strength + Circuit', tag:'Heavy then hard · 40 min', ex:['kbswing','squat','splitsq','sledPush','wallball'],
     circuitFrom:3,
     brief:'Swings, squats and split squats first with full rest — about 25 minutes. Then the last two back to back, no rest, for roughly 10 minutes of circuit. Heavy work protects your running mechanics late in the race; that is what strength actually buys you.'},
  2:{n:'Easy Run',        tag:'Aerobic · 30–45 min', ex:['easyrun'],
     brief:'Conversational pace. Easy aerobic volume is the strongest single predictor of a fast Hyrox — this is not a soft option.'},
  3:{n:'Threshold Run',   tag:'Quality · 40 min', ex:['run1k','row','calfraise','plank'],
     brief:'The highest-value session of your week. Threshold running first while fresh, then the rower, then calves and core. One second per km off your pace is eight seconds off race day.'},
  4:{n:'Easy Run',        tag:'Aerobic · 30–45 min', ex:['easyrun'],
     brief:'Second easy day. Keep it genuinely easy — Friday is the hard one and you cannot fake recovery.'},
  5:{n:'Race Simulation', tag:'Full effort · 40 min', ex:['run1k','ski','run1k','farmers','run1k','lunges'],
     brief:'Official race order, compromised running. Run at your 1 km best + 10–15 s/km, not flat out. Practise transitions: no standing still, know your grip before you arrive.',
     half:true, roxDrill:true},
  6:{n:'Optional Accessory',tag:'Top-up · 30 min', ex:['hipthrust','row_bb','ohp','farmhold','boxjump'],
     brief:'Only if Friday felt easy. Posterior chain, pull, press, grip, a little power. If you are tired, skip it — the week already has two hard days and that is the ceiling.'},
  0:{n:'Rest',            tag:'Recovery', ex:[], brief:'Full rest. Adaptation happens now, not in the gym.'},
};

/* ---------------- BLOCKS ---------------- */
/* Blocks counted BACKWARD from race day, so the taper always lands
   in the right place no matter when training started. */
function blockOf(){
  if(racePassed()) return {n:'Season complete',
    f:'Race day has passed. Set a new race date to start a fresh block.', i:6, out:0, done:true};
  const out=weeksOut();
  if(out<=1)  return {n:'Race Week',          f:'Nothing you do now adds fitness. Move, sleep, eat, rehearse transitions.', i:5, out};
  if(out<=3)  return {n:'Block 4 · Taper',    f:'10–14 days at about half the volume, intensity held. Sharpen, do not dig.', i:4, out};
  if(out<=9)  return {n:'Block 3 · Simulation',f:'Race-order work weekly at goal pace. Pacing and transitions are the focus now.',i:3, out};
  if(out<=15) return {n:'Block 2 · Build',    f:'Strength endurance. Volume and intensity climb together; hold the heavy loads.',i:2, out};
  return        {n:'Block 1 · Base',          f:'Aerobic base and strength foundation. Get a real number on every station.', i:1, out};
}

/* ---------------- STATE ---------------- */
let S = {profile:{}, logs:[], weights:[], targets:{}, settings:{}};
const KEY='hyroxApp_v3';

function load(){
  try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){}
  S.profile = S.profile||{}; S.logs=S.logs||[]; S.weights=S.weights||[]; S.targets=S.targets||{}; S.settings=S.settings||{};
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Storage full'); } }

/* ---------------- HELPERS ---------------- */
const pad=n=>String(n).padStart(2,'0');
function fmt(v,kind){
  if(v==null||isNaN(v))return '—';
  if(kind==='time'){ const m=Math.floor(v/60), s=Math.round(v%60); return m+':'+pad(s); }
  if(kind==='kg')  return v+' kg';
  if(kind==='reps')return v+'';
  if(kind==='dist')return v+' km';
  return String(v);
}
function parseVal(str,kind){
  if(str==null)return null;
  str=String(str).trim(); if(!str)return null;
  if(kind==='time'){
    if(str.includes(':')){ const p=str.split(':'); return (+p[0]||0)*60 + (+p[1]||0); }
    const n=parseFloat(str); return isNaN(n)?null:n;      // bare number = seconds
  }
  const n=parseFloat(str); return isNaN(n)?null:n;
}
/* Signed: negative once the date has passed. daysTo used to clamp at 0, which
   left weeksOut pinned at 1 forever and the app stuck in "Race Week" months
   after race day. Callers that want the old behaviour use daysToClamped. */
function daysTo(d){ return Math.ceil((d - new Date())/864e5); }
function daysToClamped(d){ return Math.max(0, daysTo(d)); }
function racePassed(){ return daysTo(RACE) < 0; }
function weekNo(){ const w=Math.floor((new Date()-PLAN_START)/(7*864e5))+1; return Math.max(1,w); }
/* Weeks remaining until race day — periodisation is anchored to the RACE,
   not to when the app happened to be installed. 1 = race week. */
function weeksOut(){ return Math.max(1, Math.ceil(daysToClamped(RACE)/7)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
/* Friday's session changes with the block: a full simulation is a hard,
   costly session. Base = short sim. Build = half sim. Simulation block =
   full race order. Peak = sharpening only. */
const FRIDAY_BY_BLOCK={
  /* Every block now touches stations that were previously never scheduled
     (row, farmers carry, sandbag lunges) — they are scored the same as the
     sleds on race day, and were the three with no data from him. */
  1:{n:'Mini Simulation',  tag:'Moderate · 40 min', ex:['run1k','ski','run1k','farmers','run1k','lunges'], half:true, roxDrill:true,
     brief:'Short race-order block, built around the two stations you have never timed. Not a maximal effort — the point is getting a real number and learning to move on tired legs.'},
  2:{n:'Half Simulation',  tag:'Hard · 40 min', ex:['run1k','ski','run1k','sledPush','run1k','row','run1k','farmers'], half:true, roxDrill:true,
     brief:'Official race order. Hold run pace at your 1 km best + 10–15 s/km. Every station follows a run — that is the whole point.'},
  3:{n:'Race Simulation',  tag:'Full effort · 40 min', ex:['run1k','ski','run1k','sledPush','run1k','sledPull','run1k','burpee','run1k','row'], half:true, roxDrill:true,
     brief:'Game speed. All runs within 10% of each other — consistency predicts race day better than any single split.'},
  4:{n:'Race Sharpener',   tag:'Short · 25 min', ex:['run1k','sledPush','run1k','wallball'], half:true, roxDrill:true,
     brief:'Race pace, half the volume. Intensity stays, volume drops. You are rehearsing now, not building.'},
  5:{n:'Race Rehearsal',   tag:'Easy · 20 min', ex:['run1k','ski'], half:true, roxDrill:true,
     brief:'Movement and transitions only. Nothing you do this week adds fitness; you can only subtract it.'},
};
function dayPlan(d){
  const g=(d||new Date()).getDay();
  if(g===5){ const b=blockOf(); return FRIDAY_BY_BLOCK[b.i]||FRIDAY_BY_BLOCK[2]; }
  return WK[g]||WK[0];
}   // 1Mon..5Fri, 0Sun rest, 6Sat optional
function dowName(d){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function longDate(d){ return dowName(d)+', '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

/* ---------------- INPUT SANITY ----------------
   A mistyped value becomes your best, then your target, and because targets
   ratchet it never comes back down — every later session reads as a miss.
   So every entry is range-checked against the exercise's own baseline. */
function sane(k, v){
  const e=EX[k]; if(!e||v==null||isNaN(v)) return {ok:false, why:'Not a number'};
  if(v<=0) return {ok:false, why:'Must be greater than zero'};
  const base=e.base||0;
  // generous bounds: a quarter to four times baseline covers any real progress
  const lo = base*0.25, hi = base*4;
  if(base && v<lo) return {ok:false, soft:true, why:`${fmt(v,e.kind)} is far below your baseline of ${fmt(base,e.kind)} — check the units`};
  if(base && v>hi) return {ok:false, soft:true, why:`${fmt(v,e.kind)} is far above your baseline of ${fmt(base,e.kind)} — check the units`};
  return {ok:true};
}

/* ---------------- MACHINE SETTINGS ----------------
   A time only means something alongside the setting it was set at.
   Defaults are remembered in S.settings.machines and pre-filled. */
const MACHINES = {
  curve: {n:'Curved treadmill', fields:[
    {k:'level', label:'Resistance / gear', ph:'3', hint:'Level you ran at'}]},
  ski:   {n:'SkiErg', fields:[
    {k:'damper', label:'Damper', ph:'5', hint:'1–10'},
    {k:'drag',   label:'Drag factor', ph:'110', hint:'Optional'}]},
  rower: {n:'Rower', fields:[
    {k:'damper', label:'Damper', ph:'5', hint:'1–10'},
    {k:'drag',   label:'Drag factor', ph:'120', hint:'Optional'},
    {k:'rate',   label:'Stroke rate', ph:'26', hint:'spm, optional'}]},
};
/* which exercises run on which machine */
const EX_MACHINE = { run1k:'curve', easyrun:'curve', ski:'ski', row:'rower' };

function machineOf(k){ const m=EX_MACHINE[k]; return m?MACHINES[m]:null; }
function machineKey(k){ return EX_MACHINE[k]||null; }
function savedMachine(k){
  const mk=machineKey(k); if(!mk) return {};
  return (S.settings.machines&&S.settings.machines[mk])||{};
}
function saveMachine(k, vals){
  const mk=machineKey(k); if(!mk) return;
  S.settings.machines = S.settings.machines||{};
  S.settings.machines[mk] = Object.assign({}, S.settings.machines[mk], vals);
}
/* a one-line summary for display, e.g. "Damper 5 · 110 df" */
function machineSummary(k, vals){
  const m=machineOf(k); if(!m) return '';
  const v=vals||savedMachine(k);
  return m.fields.map(f=>v[f.k]?`${f.label==='Resistance / gear'?'Level':f.label} ${v[f.k]}`:null)
          .filter(Boolean).join(' · ');
}

/* How many sets does the current prescription call for?
   Parses the leading "3 × 15" or "4 × 8" out of the rx string. */
function setsOf(k){
  const rx=rxOf(k); if(!rx) return 1;
  const m=rx.match(/^\s*(\d+)\s*[×x]/);
  return m?Math.max(1,Math.min(10,parseInt(m[1],10))):1;
}
function repsOf(k){
  const rx=rxOf(k); if(!rx) return null;
  const m=rx.match(/^\s*\d+\s*[×x]\s*([\d.]+)/);
  return m?m[1]:null;
}

/* The prescription for this exercise in the current block.
   rx is [base, build, simulation, taper]; blockOf().i is 1..5. */
function rxOf(k, blockIdx){
  const e=EX[k]; if(!e||!e.rx) return null;
  const i = Math.min(Math.max((blockIdx||blockOf().i)-1, 0), e.rx.length-1);
  return e.rx[i];
}

/* Target = the scaled target if one exists, else the baseline — but never
   easier than what you have already done. A target you have beaten is not a
   target; it ratchets to your own best so today always asks for progress. */
function targetOf(k){
  const set = S.targets[k]!=null ? S.targets[k] : EX[k].base;
  const h=histOf(k); if(!h.length) return set;
  const vs=h.map(x=>x.v);
  const best = EX[k].dir==='lower' ? Math.min(...vs) : Math.max(...vs);
  return EX[k].dir==='lower' ? Math.min(set,best) : Math.max(set,best);
}

/* all logged entries for one exercise, oldest→newest */
function histOf(k){
  const out=[];
  S.logs.forEach(l=>{ if(l.results && l.results[k]!=null) out.push({d:l.date, v:l.results[k]}); });
  return out.sort((a,b)=>a.d<b.d?-1:1);
}
function latestOf(k){ const h=histOf(k); return h.length?h[h.length-1].v:null; }
function bestOf(k){
  const h=histOf(k); if(!h.length)return null;
  const vs=h.map(x=>x.v);
  return EX[k].dir==='lower' ? Math.min(...vs) : Math.max(...vs);
}
/* did a value hit its target? */
function isHit(k,v){
  const t=targetOf(k); if(v==null)return null;
  return EX[k].dir==='lower' ? v<=t : v>=t;
}
/* The target a session was actually judged against ON THE DAY: the stored
   target, or the baseline, ratcheted only by results from BEFORE that date.
   Without this, ratcheting today's target would retroactively turn every
   past session into a miss — only your single best effort could ever count. */
function targetAsOf(k,date){
  const set = S.targets[k]!=null ? S.targets[k] : EX[k].base;
  const prior = histOf(k).filter(x=>x.d<date).map(x=>x.v);
  if(!prior.length) return set;
  const best = EX[k].dir==='lower' ? Math.min(...prior) : Math.max(...prior);
  return EX[k].dir==='lower' ? Math.min(set,best) : Math.max(set,best);
}
function isHitAsOf(k,v,date){
  if(v==null)return null;
  const t=targetAsOf(k,date);
  return EX[k].dir==='lower' ? v<=t : v>=t;
}
/* % change latest vs baseline, positive = improvement */
function improvePct(k){
  const l=latestOf(k); if(l==null)return null;
  const b=EX[k].base; if(!b)return null;
  const raw=(l-b)/b*100;
  return EX[k].dir==='lower' ? -raw : raw;
}
</script>
<script>
/* =====================================================================
   SVG LINE CHART — per-exercise progress
   ===================================================================== */
function lineChart(k,range){
  const e=EX[k];
  let h=histOf(k);
  if(range && range!=='all'){
    const cut=new Date(Date.now()-range*864e5).toISOString().slice(0,10);
    h=h.filter(x=>x.d>=cut);
  }
  if(h.length<1){
    return '<div class="empty" style="padding:30px 10px"><p>No data yet. Log this exercise and your progress line appears here.</p></div>';
  }
  const W=320,H=132,PL=6,PR=6,PT=14,PB=20;
  const tgt=targetOf(k), base=e.base;
  const vals=h.map(x=>x.v).concat([tgt,base]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const span=(hi-lo)||Math.max(1,hi*0.1);
  lo-=span*0.18; hi+=span*0.18;
  const X=i=>h.length===1 ? W/2 : PL+(W-PL-PR)*(i/(h.length-1));
  const Y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
  const good=e.dir==='lower';

  let pts=h.map((p,i)=>[X(i),Y(p.v)]);
  let line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-PB} L${pts[0][0].toFixed(1)} ${H-PB} Z`;

  // trend: is latest better than first?
  const first=h[0].v, last=h[h.length-1].v;
  const better = good ? last<first : last>first;
  const col = h.length<2 ? 'var(--gold)' : (better?'var(--green)':'var(--red)');

  let dots=pts.map((p,i)=>{
    const hit=isHitAsOf(k,h[i].v,h[i].d);   // judged against that day's target
    const c = hit===null?'var(--muted)':(hit?'var(--green)':'var(--red)');
    const r = i===pts.length-1?4.5:3;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${c}" stroke="var(--navy)" stroke-width="1.5"/>`;
  }).join('');

  const yT=Y(tgt), yB=Y(base);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
<defs><linearGradient id="g_${k}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="${col}" stop-opacity=".26"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
</linearGradient></defs>
<line x1="0" y1="${yB.toFixed(1)}" x2="${W}" y2="${yB.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="0" y1="${yT.toFixed(1)}" x2="${W}" y2="${yT.toFixed(1)}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="5 4" opacity=".65"/>
<path d="${area}" fill="url(#g_${k})"/>
<path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
${dots}
<text x="2" y="${Math.max(9,yT-4).toFixed(1)}" fill="var(--gold)" font-size="8.5" font-weight="700" opacity=".9">TARGET ${fmt(tgt,e.kind)}</text>
</svg>
<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:600">
<span>${h[0].d.slice(5).replace('-','/')}</span><span>${h.length} session${h.length>1?'s':''}</span><span>${h[h.length-1].d.slice(5).replace('-','/')}</span></div>`;
}

/* small inline sparkline for list rows */
function spark(k){
  const h=histOf(k); if(h.length<2)return '';
  const e=EX[k], vs=h.slice(-8).map(x=>x.v);
  const lo=Math.min(...vs),hi=Math.max(...vs),sp=(hi-lo)||1;
  const W=54,H=20;
  const p=vs.map((v,i)=>`${(W*i/(vs.length-1)).toFixed(1)},${(H-2-(H-4)*(v-lo)/sp).toFixed(1)}`).join(' ');
  const better=e.dir==='lower'?vs[vs.length-1]<vs[0]:vs[vs.length-1]>vs[0];
  return `<svg width="${W}" height="${H}" style="display:block"><polyline points="${p}" fill="none" stroke="${better?'var(--green)':'var(--red)'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* weight / body chart */
function weightChart(){
  const h=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(h.length<1) return '<div class="empty" style="padding:30px 10px"><p>Log your weight to see the trend.</p></div>';
  const W=320,H=132,PT=14,PB=20;
  const vs=h.map(x=>x.kg);
  let lo=Math.min(...vs),hi=Math.max(...vs); const sp=(hi-lo)||2; lo-=sp*.3; hi+=sp*.3;
  const X=i=>h.length===1?W/2:(W-10)*(i/(h.length-1))+5;
  const Y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
  const pts=h.map((p,i)=>[X(i),Y(p.kg)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-PB} L${pts[0][0].toFixed(1)} ${H-PB} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="var(--gold)" stroke="var(--navy)" stroke-width="1.5"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
<defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--gold)" stop-opacity=".26"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
<path d="${area}" fill="url(#gw)"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>
<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:600">
<span>${h[0].d.slice(5).replace('-','/')}</span><span>${h.length} entr${h.length>1?'ies':'y'}</span><span>${h[h.length-1].d.slice(5).replace('-','/')}</span></div>`;
}

/* =====================================================================
   COACH ENGINE
   ===================================================================== */
function hitRate(logs){
  let hit=0,tot=0;
  // easy / substitute days keep your consistency but never judge your targets
  logs.filter(l=>!l.easy).forEach(l=>{ Object.keys(l.results||{}).forEach(k=>{
    if(!EX[k])return;
    // judge each session against the target it faced on the day, not today's
    const r=isHitAsOf(k,l.results[k],l.date); if(r!==null){tot++; if(r)hit++;}
  });});
  return tot? {pct:Math.round(hit/tot*100), hit, tot} : null;
}
function weekLogs(w){
  const s=new Date(PLAN_START.getTime()+(w-1)*7*864e5);
  const e=new Date(s.getTime()+7*864e5);
  const a=s.toISOString().slice(0,10), b=e.toISOString().slice(0,10);
  return S.logs.filter(l=>l.date>=a && l.date<b);
}
/* Sessions in the N days before today. Used for scaling, because a calendar
   week keyed to a fixed start date reports 0% whenever training shifts by a
   day or two — and 0% would wrongly ease every target. */
function recentLogs(days){
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  const today=todayKey();
  return S.logs.filter(l=>l.date>=cut && l.date<=today);
}

/* auto-scale: applies YOUR rules — 90%+ up 2–5%, 70–90% hold, <70% down 3% */
function autoScale(){
  const w=weekNo(); if(w<2) return {changed:0,msg:null};
  if(S.settings.scaledWeek===w) return {changed:0,msg:null};
  // last 7 days of ACTUAL training — never a fixed calendar window, and never
  // scale on an empty week (a rest or travel week is not a failed week)
  const prev=recentLogs(7);
  if(prev.length<2) return {changed:0,msg:null};
  const hr=hitRate(prev); if(!hr||hr.tot<3) return {changed:0,msg:null};

  let dir=0,pct=0;
  if(hr.pct>=90){dir=1;pct=0.03;}
  else if(hr.pct<70){dir=-1;pct=0.03;}
  if(!dir){ S.settings.scaledWeek=w; save(); return {changed:0,msg:`Hit rate ${hr.pct}% — targets held for Week ${w}.`}; }

  let n=0;
  const touched={};
  prev.forEach(l=>Object.keys(l.results||{}).forEach(k=>touched[k]=1));
  Object.keys(touched).forEach(k=>{
    const e=EX[k]; if(!e)return;
    const cur=targetOf(k);
    // improving a 'lower' metric = reduce the target; improving 'higher' = raise it
    const delta = cur*pct*(e.dir==='lower' ? -dir : dir);
    let nv = cur+delta;
    nv = (e.kind==='reps'||e.kind==='kg') ? Math.round(nv) : Math.round(nv*10)/10;
    if(nv!==cur && nv>0){ S.targets[k]=nv; n++; }
  });
  S.settings.scaledWeek=w; save();
  return {changed:n, msg:`Hit rate ${hr.pct}% last week — ${dir>0?'targets tightened':'targets eased'} 3% on ${n} exercise${n===1?'':'s'}.`};
}

/* =====================================================================
   RACE PROJECTION — a real number, built from your splits
   Race = 8 × 1 km run + 8 stations + Roxzone.
   Uses your best logged time per element; falls back to the baseline
   (field average) for anything you have not logged, and says so.
   ===================================================================== */
const RACE_ORDER=['ski','sledPush','sledPull','burpee','row','farmers','lunges','wallball'];
const FIELD_AVG=92802/1000; // placeholder guard, unused
function projectRace(){
  let total=0, known=0, assumed=0;
  // 8 km of running
  const r=bestOf('run1k')!=null?bestOf('run1k'):EX.run1k.base;
  if(bestOf('run1k')!=null)known++; else assumed++;
  total += r*8;
  // 8 stations
  RACE_ORDER.forEach(k=>{
    const b=bestOf(k);
    if(b!=null){ total+=b; known++; } else { total+=EX[k].base; assumed++; }
  });
  // transitions
  const rx=bestOf('roxzone');
  if(rx!=null){ total+=rx; known++; } else { total+=EX.roxzone.base; assumed++; }
  return {secs:Math.round(total), known, assumed, total:known+assumed};
}
function fmtClock(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=Math.round(s%60);
  return h? h+':'+pad(m)+':'+pad(ss) : m+':'+pad(ss);
}
const FIELD_FINISH=5202; // Open men average 1:26:42

function coachLines(){
  const out=[];
  const w=weekNo(), bl=blockOf(w), d=daysTo(RACE);
  const all=hitRate(S.logs);
  const lw=hitRate(recentLogs(14).filter(l=>!recentLogs(7).includes(l)));
  const tw=recentLogs(7);

  if(!S.logs.length){
    out.push(['Start here','Log your first session and I start calibrating. Your baselines are already loaded from your training log — sled push 152 kg, sled pull 103 kg, 1 km at 6:41. The first two weeks confirm or correct them.']);
    return out;
  }

  // overall standing
  if(all){
    if(all.pct>=90) out.push(['Standing',`<b>${all.pct}% hit rate</b> across ${all.tot} tracked results. That is a tightening phase, not a maintenance one — targets will keep climbing. Watch that form holds on sleds as the load goes up.`]);
    else if(all.pct>=70) out.push(['Standing',`<b>${all.pct}% hit rate</b> across ${all.tot} results. This is the right zone. Targets are calibrated to you — hold here and the adaptation accumulates.`]);
    else out.push(['Standing',`<b>${all.pct}% hit rate</b> across ${all.tot} results. Targets are ahead of you right now. That is a calibration problem, not a you problem — they come down 3% and you rebuild from a number you can actually hit.`]);
  }
  // last week vs this week
  if(lw && tw.length){
    out.push(['This week',`${tw.length} session${tw.length===1?'':'s'} logged. Last week you hit ${lw.pct}%. Keep the Friday simulation honest — that is the session that predicts race day.`]);
  } else if(tw.length){
    out.push(['This week',`${tw.length} session${tw.length===1?'':'s'} logged. Mon, Wed and Fri are your full sessions; Tue and Thu runs are the aerobic floor underneath them.`]);
  }

  // weakest + strongest station
  const scored=Object.keys(EX).filter(k=>latestOf(k)!=null).map(k=>({k,p:improvePct(k)})).filter(x=>x.p!=null);
  if(scored.length>=2){
    scored.sort((a,b)=>a.p-b.p);
    const weak=scored[0], strong=scored[scored.length-1];
    out.push(['Biggest gap',`<b>${EX[weak.k].n}</b> is ${weak.p<0?Math.abs(weak.p).toFixed(1)+'% behind':'flat against'} baseline. ${coachFix(weak.k)}`]);
    if(strong.p>1) out.push(['Strongest',`<b>${EX[strong.k].n}</b> is ${strong.p.toFixed(1)}% up on baseline. Bank it — stop adding load there and put the effort where the gap is.`]);
  }

  // untracked race stations
  const missing=Object.keys(EX).filter(k=>EX[k].grp==='hyrox' && latestOf(k)==null);
  if(missing.length){
    out.push(['Blind spots',`${missing.length} race station${missing.length===1?' has':'s have'} no data: <b>${missing.map(k=>EX[k].n).join(', ')}</b>. On race day these are scored the same as the sleds. Get one number on each — even a rough one — so the plan stops guessing.`]);
  }

  // block + countdown
  out.push(['Where you are',`<b>${bl.n}</b> — ${bl.out} week${bl.out===1?'':'s'} out. ${bl.f}`]);
  return out;
}
function coachFix(k){
  const m={
    run1k:'Add one extra 1 km rep on Wednesday before you touch the pace target.',
    ski:'Shorten the stroke and raise the rate — most lost time on SkiErg is a slow catch, not weak legs.',
    sledPush:'Lower your hips and take shorter, faster steps. Drop the load 10 kg and chase speed for two weeks.',
    sledPull:'This is grip and lats. KB swings and bent-over row feed it directly — push those.',
    burpee:'Jump less far, cycle faster. Broad jump distance is where people blow their heart rate.',
    row:'Hold the stroke rate down and drive with legs. Rate 24–26, not 30.',
    farmers:'Pure grip. Add farmers holds to the end of every strength session.',
    lunges:'Lunges fail from quads, not lungs. Split squats and step-ups are the fix.',
    wallball:'Breathe at the top, not the bottom. Thrusters build the engine for this.',
    kbswing:'Hips snap, arms stay loose — the bell floats, you do not lift it. Add reps before you add weight.',
    squat:'Depth before load. Film one set from the side.',
    pullup:'Negatives. Three slow five-second lowers at the end of each session.',
  };
  return m[k]||'Keep logging it — two more sessions and I can tell you whether this is form or fitness.';
}
