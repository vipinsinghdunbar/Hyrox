<script>
/* =====================================================================
   WORKOUT MODE — block-based, auto-advancing, skippable rest
   ===================================================================== */
let W=null;          // active workout session
const WKEY='hyroxWorkout_v1';
/* An in-progress workout must survive a phone call, an app switch or a
   reload — iOS suspends background pages aggressively. W is snapshotted to
   localStorage after every state change and restored on load. */
function wkPersist(){
  try{
    if(!W){ localStorage.removeItem(WKEY); return; }
    localStorage.setItem(WKEY, JSON.stringify({
      plan:W.plan, blocks:W.blocks, i:W.i, phase:W.phase,
      t0:W.t0, startedAt:W.startedAt, restEnd:W.restEnd, restFrom:W.restFrom,
      results:W.results, splits:W.splits, rox:W.rox,
      setsDone:W.setsDone, sameStation:W.sameStation,
      pendingKey:W.pendingKey, pendingSecs:W.pendingSecs, pendingSetIx:W.pendingSetIx,
      pendingTimed:W.pendingTimed, pendingWhy:W.pendingWhy,
      setData:W.setData, viewSet:W.viewSet, showCue:W.showCue,
      savedAt:Date.now(), date:todayKey()
    }));
  }catch(e){}
}
function wkStored(){
  try{
    const raw=localStorage.getItem(WKEY); if(!raw) return null;
    const d=JSON.parse(raw);
    // only offer to resume today's workout, and only within 6 hours
    if(d.date!==todayKey() || (Date.now()-d.savedAt)>6*3600e3){ localStorage.removeItem(WKEY); return null; }
    return d;
  }catch(e){ return null; }
}
function wkResume(){
  const d=wkStored(); if(!d){ toast('Nothing to resume'); return; }
  W=Object.assign({}, d);
  W.splits=W.splits||{}; W.results=W.results||{}; W.setsDone=W.setsDone||{};
  W.setData=W.setData||{}; if(W.viewSet===undefined) W.viewSet=null;
  document.getElementById('wk').classList.add('on');
  if(wkTick)clearInterval(wkTick);
  wkTick=setInterval(wkFrame,100);
  // a rest timer that expired while away should not strand you on the rest screen
  if(W.phase==='rest' && W.restEnd<=Date.now()) W.restEnd=Date.now()+5000;
  wkRender();
}
function wkDiscardStored(){ try{ localStorage.removeItem(WKEY); }catch(e){} render(); }
let wkTick=null;     // interval handle
let wakeLock=null;

const REST={sledPush:120,sledPull:120,squat:150,kbswing:90,ohp:120,row_bb:120,
            farmhold:90,plank:60,_round:180,_default:90};
/* A session can mark where its circuit starts (plan.circuitFrom, a 0-based
   index into plan.ex). From that station on, rest is 15 s — just enough to
   walk to the next station, not enough to recover. That is the point. */
function restFor(k, idx, plan){
  if(plan && plan.circuitFrom!=null && idx!=null && idx>=plan.circuitFrom) return 15;
  return REST[k]!=null?REST[k]:REST._default;
}

/* build the block list for a plan */
function buildBlocks(plan){
  const rounds = plan.half?1:1;
  const blocks=[];
  // seen counter lets the same exercise appear several times in one round
  const seen={};
  for(let r=1;r<=rounds;r++){
    plan.ex.forEach((k,i)=>{
      seen[k]=(seen[k]||0)+1;
      blocks.push({k, round:r, rounds, rep:seen[k], last:(i===plan.ex.length-1)});
    });
  }
  return blocks;
}

async function wkStart(override){
  const plan = override || dayPlan(new Date());
  if(!plan.ex.length){ toast('Rest day — nothing scheduled'); return; }
  W={plan, blocks:buildBlocks(plan), i:0, phase:'work', t0:Date.now(), startedAt:Date.now(),
     results:{}, splits:{}, restEnd:0};
  document.getElementById('wk').classList.add('on');
  try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){}
  if(wkTick)clearInterval(wkTick);
  wkTick=setInterval(wkFrame,100);
  wkPersist(); wkRender();
}
function wkQuit(){
  /* Guard on WORK DONE, not on station index. Finishing two of three sets on
     station 1 leaves W.i at 0, and that used to quit on a single tap and throw
     the sets away. */
  const didWork = W && (W.i>0
    || Object.keys(W.results||{}).length>0
    || Object.keys(W.setData||{}).length>0
    || Object.values(W.setsDone||{}).some(n=>n>0));
  if(didWork && W.phase!=='summary'){
    if(!confirmQuit()) return;
  }
  wkClose();
}
let _quitArmed=false;
function confirmQuit(){
  if(_quitArmed){ _quitArmed=false; return true; }
  _quitArmed=true; toast('Tap × again to discard this session');
  setTimeout(()=>_quitArmed=false,3000);
  return false;
}
function wkClose(){
  try{ localStorage.removeItem(WKEY); }catch(e){}
  document.getElementById('wk').classList.remove('on','rest','done');
  if(wkTick){clearInterval(wkTick);wkTick=null;}
  try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){}
  W=null; _quitArmed=false; render();
}

/* ---- swipeable set pager --------------------------------------------------
   Dots are tappable AND the card swipes left/right, so you can look back at
   set 1 while standing in set 2 without losing your place. */
function setPagerHTML(k){
  const n=setsOf(k); if(n<2) return '';
  const e=EX[k];
  const done=(W.setsDone&&W.setsDone[k])||0;   // sets finished
  const live=Math.min(done, n-1);              // the set you are in now
  const view=setView(k);
  const unit = e.kind==='kg'?'kg':e.kind==='dist'?'km':e.kind==='time'?'':'reps';

  /* Every set is rendered as its own panel; the track slides to show one. */
  const panels = Array.from({length:n},(_,i)=>{
    const rec=setGet(k,i);
    const isDone = i<done;
    const isNow  = i===live && !isDone;
    let inner;
    if(isDone){
      inner = `<div class="sp-h">Set ${i+1} · done</div>
        <div class="sp-big">${rec&&rec.t!=null?fmt(rec.t,'time'):'—'}</div>`
        + (e.kind!=='time'
            ? `<div class="sp-w">
                 <button onclick="bumpSet('${k}',${i},-2)">−</button>
                 <input id="spEdit_${i}" type="number" inputmode="decimal" step="any"
                        value="${rec&&rec.v!=null?rec.v:''}" onchange="editSet('${k}',${i})">
                 <span class="u">${unit}</span>
                 <button onclick="bumpSet('${k}',${i},2)">+</button>
               </div>`
            : `<div class="sp-sub">Logged</div>`);
    } else if(isNow){
      inner = `<div class="sp-h">Set ${i+1} · now</div>
        <div class="sp-sub">${rxOf(k)||''}</div>
        <div class="sp-sub">Target <b style="color:var(--yellow)">${fmt(targetOf(k),e.kind)}</b></div>`;
    } else {
      inner = `<div class="sp-h">Set ${i+1} · up next</div>
        <div class="sp-sub">${rxOf(k)||''}</div>`;
    }
    return `<div class="setpage ${isDone?'isdone':''} ${isNow?'isnow':''} ${i===view?'':'off'}">${inner}</div>`;
  }).join('');

  const tabs = Array.from({length:n},(_,i)=>{
    const isDone=i<done, isLive=(i===live && !isDone);
    return `<button class="stab${isDone?' done':''}${isLive?' live':''}${i===view?' sel':''}"
       onclick="goSet(${i})">${isDone?'<span class="tk">✓</span>':''}Set ${i+1}</button>`;
  }).join('');

  return `<div class="settabs">${tabs}</div>
  <div class="setpager" id="spWrap"
      ontouchstart="spStart(event)" ontouchmove="spMove(event)" ontouchend="spEnd(event)"
      onmousedown="spStart(event)">
    <div class="sptrack" id="spTrack">${panels}</div>
  </div>`;
}

function wkFrame(){
  if(!W)return;
  const el=document.getElementById('wkElapsed');
  if(el) el.textContent=fmt(Math.floor((Date.now()-W.startedAt)/1000),'time');
  if(W.phase==='work'){
    const s=(Date.now()-W.t0)/1000;
    const tv=document.getElementById('wkTime');
    if(tv){
      tv.textContent=fmt(Math.floor(s),'time');
      const b=W.blocks[W.i], t=targetOf(b.k);
      if(EX[b.k].dir==='lower') tv.className='wk-time '+(s<=t?'ok':'over');
    }
  } else if(W.phase==='rest'){
    const left=Math.max(0,Math.ceil((W.restEnd-Date.now())/1000));
    const tv=document.getElementById('wkTime');
    if(tv) tv.textContent=fmt(left,'time');
    if(left<=0) wkNext();
  }
}

/* ---- per-set record -------------------------------------------------------
   W.setData[key][i] = {t:<seconds>, v:<weight/reps>}
   One entry per set, so a finished set can be shown and corrected later. */
function setLog(k, ix, patch){
  W.setData = W.setData || {};
  const a = (W.setData[k] = W.setData[k] || []);
  a[ix] = Object.assign({}, a[ix] || {}, patch);
}
function setGet(k, ix){ return (W.setData && W.setData[k] && W.setData[k][ix]) || null; }

/* roll the session result up from the individual sets (best set wins) */
function rollUp(k){
  const e=EX[k], a=(W.setData&&W.setData[k])||[];
  let best=null;
  a.forEach(s=>{ if(!s || s.v==null) return;
    best = best==null ? s.v : (e.dir==='lower' ? Math.min(best,s.v) : Math.max(best,s.v)); });
  if(best!=null) W.results[k]=best;
}

function wkRestSameStation(b){
  W.phase='rest'; W.restFrom=Date.now();
  W.restEnd=Date.now()+restFor(b.k, W.i, W.plan)*1000;
  W.sameStation=true;
  wkRender();
}

/* which set the pager is showing; null = follow the live set */
function setView(k){
  const done=(W.setsDone&&W.setsDone[k])||0;
  const n=setsOf(k);
  if(W.viewSet==null) return Math.min(done, n-1);
  return Math.max(0, Math.min(W.viewSet, n-1));
}
function viewSet(d){
  const b=W.blocks[W.i]; if(!b) return;
  const n=setsOf(b.k);
  const cur=setView(b.k);
  const nx=Math.max(0, Math.min(cur+d, n-1));
  goSet(nx);
}
function toggleCue(){ if(!W)return; W.showCue=!W.showCue; wkPersist(); wkRender(); }
function goSet(i){
  const b=W&&W.blocks[W.i]; if(!b) return;
  W.viewSet=Math.max(0, Math.min(i, setsOf(b.k)-1));
  spPlace(W.viewSet, true);   // slide first, so the motion is visible
  wkRender();
}

/* ---- finger drag on the set carousel ---------------------------------------
   The track follows the finger in real time and snaps to the nearest set on
   release. A short flick counts even if it did not travel far. */
let _sw=null;
/* Panels are narrower than the window (the neighbours peek), so the track is
   offset in pixels off the real panel pitch, not in percent. */
/* offsetWidth/offsetLeft ignore the CSS scale() on inactive panels, so the
   pitch stays constant; getBoundingClientRect() would shrink with the scale
   and drift the centring set by set. */
function spStep(){
  const tr=document.getElementById('spTrack');
  if(!tr||tr.children.length<2) return tr&&tr.children.length?tr.children[0].offsetWidth:0;
  return tr.children[1].offsetLeft - tr.children[0].offsetLeft;   // width + gap
}
function spOffset(i){
  const tr=document.getElementById('spTrack');
  if(!tr||!tr.children.length) return 0;
  /* panels are full-window width now, so panel i sits at exactly -i*pitch */
  return -i*spStep();
}
function spPlace(i, anim){
  const tr=document.getElementById('spTrack');
  if(!tr||!tr.children.length) return;
  if(!anim) tr.classList.add('drag');
  tr.style.transform=`translateX(${spOffset(i)}px)`;
  if(!anim) requestAnimationFrame(()=>tr.classList.remove('drag'));
}
/* Mouse drag (desktop / testing) needs document-level move+up; touch is bound
   inline on the element. Registered once. */
if(typeof window!=='undefined' && !window._spBound){
  window._spBound=true;
  document.addEventListener('mousemove',e=>{ if(_sw) spMove(e); });
  document.addEventListener('mouseup',  e=>{ if(_sw) spEnd(e);  });
}
function spStart(ev){
  const b=W&&W.blocks[W.i]; if(!b||setsOf(b.k)<2) return;
  const t=ev.touches?ev.touches[0]:ev;
  const tr=document.getElementById('spTrack'), wr=document.getElementById('spWrap');
  if(!tr||!wr) return;
  /* dragging from inside the weight box would fight the number input */
  if(ev.target.closest && ev.target.closest('.sp-w')) return;
  _sw={x:t.clientX, y:t.clientY, t0:Date.now(), w:wr.clientWidth,
       i:setView(b.k), n:setsOf(b.k), moved:false, lock:null};
  tr.classList.add('drag');
}
function spMove(ev){
  if(!_sw) return;
  const t=ev.touches?ev.touches[0]:ev;
  const dx=t.clientX-_sw.x, dy=t.clientY-_sw.y;
  /* decide once whether this gesture is a horizontal swipe or a vertical scroll */
  if(_sw.lock===null){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    _sw.lock = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(_sw.lock==='y'){ return; }           // let the page scroll
  ev.preventDefault();
  _sw.moved=true;
  const tr=document.getElementById('spTrack'), wr=document.getElementById('spWrap');
  if(!tr||!wr||!tr.children.length) return;
  /* resist pulling past the first or last set */
  let off=dx;
  if((_sw.i===0 && dx>0) || (_sw.i===_sw.n-1 && dx<0)) off=dx*0.32;
  tr.style.transform=`translateX(${spOffset(_sw.i) + off}px)`;
}
function spEnd(ev){
  if(!_sw) return;
  const sw=_sw; _sw=null;
  const tr=document.getElementById('spTrack');
  if(tr) tr.classList.remove('drag');
  if(!sw.moved || sw.lock!=='x'){ spPlace(sw.i, true); return; }
  const t=(ev.changedTouches?ev.changedTouches[0]:ev);
  const dx=t.clientX-sw.x;
  const dt=Math.max(1, Date.now()-sw.t0);
  const fast=Math.abs(dx)/dt > 0.45;              // a flick
  const far =Math.abs(dx) > sw.w*0.22;            // or dragged far enough
  let nx=sw.i;
  if((fast||far) && Math.abs(dx)>18) nx = dx<0 ? sw.i+1 : sw.i-1;
  nx=Math.max(0, Math.min(nx, sw.n-1));
  W.viewSet=nx;
  spPlace(nx, true);
  wkRender();
}


/* A timed station writes straight from the stopwatch, with no entry screen to
   validate. An accidental tap therefore used to store e.g. 2 s, and because
   lower-is-better targets ratchet to your best, that bogus time became a
   target you could never beat again. Route timed results through the same
   sanity check as manual entry, and park an implausible one for confirmation
   instead of silently banking it. */
function recordTimed(k, secs){
  const e=EX[k];
  const chk=sane(k,secs);
  if(!chk.ok && chk.soft){
    W.pendingKey=k; W.pendingSecs=secs; W.pendingTimed=true; W.pendingWhy=chk.why;
    return false;                      // caller shows the confirm screen
  }
  if(!chk.ok) return false;            // hard reject: 0 or negative, drop it
  (W.splits[k]=W.splits[k]||[]).push(secs);
  const cur=W.results[k];
  W.results[k] = cur==null?secs:(e.dir==='lower'?Math.min(cur,secs):Math.max(cur,secs));
  return true;
}

/* finish current station, record the time */
function wkDone(){
  if(!W||W.phase!=='work')return;
  const b=W.blocks[W.i];
  const secs=Math.round((Date.now()-W.t0)/1000);
  const e=EX[b.k];
  /* multi-set stations: record the set, rest, come back to the same station */
  const nSets=setsOf(b.k);
  if(nSets>1){
    W.setsDone=W.setsDone||{};
    const done=(W.setsDone[b.k]||0)+1;
    W.setsDone[b.k]=done;
    /* Every set keeps its own time, so you can swipe back and see it.
       Previously secs was computed and discarded for non-time stations. */
    setLog(b.k, done-1, {t:secs});
    if(e.kind==='time' && !recordTimed(b.k, secs)){
      if(W.pendingTimed){ wkRenderEntry(); return; }   // implausible: confirm it
    }
    /* Weight/rep stations ask per set, so the load is captured while it is fresh. */
    if(e.kind!=='time'){ W.pendingKey=b.k; W.pendingSetIx=done-1; W.pendingSecs=secs;
      wkRenderEntry(); return; }
    if(done<nSets){ wkRestSameStation(b); return; }
    wkAfterStation(); return;
  }
  if(e.kind==='time'){
    // record every occurrence; store the best as the session result
    if(!recordTimed(b.k, secs) && W.pendingTimed){ wkRenderEntry(); return; }
  } else {
    W.pendingKey=b.k; W.pendingSecs=secs; wkRenderEntry(); return;
  }
  wkAfterStation();
}
function wkAfterStation(){
  const b=W.blocks[W.i];
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  const dur = restFor(b.k, W.i, W.plan);
  W.phase='rest'; W.restEnd=Date.now()+dur*1000; W.restFrom=Date.now();
  wkRender();
}
function wkNext(){
  if(!W)return;
  // bank the real transition time (Roxzone) — what actually elapsed, not what was scheduled
  if(W.phase==='rest' && W.restFrom && W.plan.half){
    W.rox=(W.rox||0)+Math.round((Date.now()-W.restFrom)/1000);
    W.restFrom=0;
  }
  if(W.sameStation){ W.sameStation=false; W.phase='work'; W.viewSet=null; W.t0=Date.now(); wkRender(); return; }
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  W.i++; W.phase='work'; W.viewSet=null; W.t0=Date.now(); wkRender();
}
function wkSkipStation(){
  if(!W)return;
  if(W.i>=W.blocks.length-1){ W.phase='summary'; wkRender(); return; }
  W.i++; W.phase='work'; W.viewSet=null; W.t0=Date.now(); wkRender();
}
/* reps/kg entry mid-workout */
function wkRenderEntry(){
  const k=W.pendingKey, e=EX[k];
  W._lastRejected=null;
  /* A stopwatch time that failed the sanity check: confirm or discard it,
     rather than asking for a number that was never typed. */
  if(W.pendingTimed){ wkRenderTimedConfirm(); return; }
  document.getElementById('wk').className='on';
  document.getElementById('wkTitle').textContent=W.plan.n;
  const six = W.pendingSetIx;
  const nS  = setsOf(k);
  const multi = six!=null && nS>1;
  /* prefill: the weight from the previous set, else your target */
  let pre = '';
  if(multi && six>0){ const pv=setGet(k,six-1); if(pv && pv.v!=null) pre=pv.v; }
  if(pre==='' ){ const t=targetOf(k); if(t!=null) pre=t; }
  document.getElementById('wkStep').textContent = multi ? `Set ${six+1} of ${nS}` : 'Enter result';
  document.getElementById('wkRail').innerHTML=railHTML();
  document.getElementById('wkBody').classList.remove('multiset');
  document.getElementById('wkBody').innerHTML=`
  <div class="wk-kick">${multi?`Set ${six+1} done`:'Station complete'}</div>
  <div class="wk-name">${e.n}</div>
  <div class="wk-sub">Took ${fmt(W.pendingSecs,'time')}. What did you actually use?</div>
  <div style="width:100%;max-width:300px">
    <div class="inrow"><input type="number" inputmode="decimal" step="any" id="wkIn" value="${pre}" placeholder="${e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps'}" style="text-align:center;font-size:24px;font-weight:800;padding:16px">
    <div class="unit">${e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps'}</div></div>
    <div style="text-align:center;font-weight:600;font-size:11.5px;line-height:1;color:var(--muted);margin-top:11px">Target ${fmt(targetOf(k),e.kind)}</div>
    <div id="wkWarn" style="text-align:center;font-weight:600;font-size:11.5px;line-height:1.5;color:var(--red);margin-top:10px;min-height:0"></div>
  </div>`;
  document.getElementById('wkFoot').innerHTML=`<button class="btn" onclick="wkSaveEntry()">Confirm</button>`;
  setTimeout(()=>{const i=document.getElementById('wkIn');if(i)i.focus();},200);
}
function wkRenderTimedConfirm(){
  const k=W.pendingKey, e=EX[k], secs=W.pendingSecs;
  document.getElementById('wk').className='on';
  document.getElementById('wkTitle').textContent=W.plan.n;
  document.getElementById('wkStep').textContent='Check this time';
  document.getElementById('wkRail').innerHTML=railHTML();
  const bd=document.getElementById('wkBody');
  bd.classList.remove('multiset');
  bd.innerHTML=`
  <div class="wk-kick">Does this look right?</div>
  <div class="wk-name">${e.n}</div>
  <div class="wk-time">${fmt(secs,'time')}</div>
  <div class="wk-vs">Target <b>${fmt(targetOf(k),e.kind)}</b></div>
  <div style="max-width:300px;margin:4px auto 0;text-align:center;font-weight:600;
       font-size:12px;line-height:1.55;color:var(--red)">${W.pendingWhy||''}</div>
  <div style="max-width:300px;margin:10px auto 0;text-align:center;font-size:11.5px;
       line-height:1.55;color:var(--muted)">Keeping a wrong time here would move your
       target permanently, so nothing is saved until you choose.</div>`;
  document.getElementById('wkFoot').innerHTML=
   `<button class="btn" onclick="wkDiscardTimed()">Discard this station</button>
    <button class="btn gh sm" onclick="wkKeepTimed()">The time is correct</button>`;
}
function wkKeepTimed(){
  const k=W.pendingKey, e=EX[k], secs=W.pendingSecs;
  (W.splits[k]=W.splits[k]||[]).push(secs);
  const cur=W.results[k];
  W.results[k] = cur==null?secs:(e.dir==='lower'?Math.min(cur,secs):Math.max(cur,secs));
  wkClearTimed();
}
function wkDiscardTimed(){ wkClearTimed(); }   // station simply records nothing
function wkClearTimed(){
  const k=W.pendingKey;
  W.pendingKey=null; W.pendingTimed=false; W.pendingWhy=null; W.pendingSecs=null;
  const b=W.blocks[W.i];
  const n=setsOf(b.k), done=(W.setsDone&&W.setsDone[b.k])||0;
  if(n>1 && done<n){ W.viewSet=null; wkRestSameStation(b); return; }
  wkAfterStation();
}

function wkSaveEntry(){
  const k=W.pendingKey, e=EX[k];
  const v=parseVal(document.getElementById('wkIn').value,e.kind);
  if(v==null||v<=0){ toast('Enter a number'); return; }
  const chk=sane(k,v);
  if(!chk.ok){
    /* A soft warning is a sanity check, not a verdict — show it on screen
       (a toast is easy to miss mid-set) and let you confirm the number. */
    const warn=document.getElementById('wkWarn');
    if(chk.soft && W._lastRejected===v){ /* second press = you meant it */ }
    else {
      if(warn) warn.innerHTML = `${chk.why}${chk.soft?'<br><b>Press Confirm again to keep it.</b>':''}`;
      else toast(chk.why);
      W._lastRejected = chk.soft ? v : null;
      return;
    }
  }
  W._lastRejected=null;
  const six=W.pendingSetIx, nS=setsOf(k);
  if(six!=null && nS>1){
    setLog(k, six, {v:v});
    rollUp(k);
    W.pendingKey=null; W.pendingSetIx=null;
    const done=(W.setsDone&&W.setsDone[k])||0;
    if(done<nS){ W.viewSet=null; wkRestSameStation(W.blocks[W.i]); return; }
    wkAfterStation(); return;
  }
  const cur=W.results[k];
  W.results[k]= cur==null?v:(e.dir==='lower'?Math.min(cur,v):Math.max(cur,v));
  W.pendingKey=null; wkAfterStation();
}

/* correcting a set you already finished, from the pager */
function editSet(k, ix){
  const e=EX[k], el=document.getElementById('spEdit_'+ix);
  if(!el) return;
  const v=parseVal(el.value, e.kind);
  if(v==null||v<=0){ toast('Enter a number'); return; }
  const chk=sane(k,v);
  if(!chk.ok){ toast(chk.why); return; }
  setLog(k, ix, {v:v});
  rollUp(k);
  wkPersist(); wkRender();
  toast(`Set ${ix+1} updated`);
}
function bumpSet(k, ix, d){
  const el=document.getElementById('spEdit_'+ix); if(!el) return;
  const e=EX[k];
  const cur=parseVal(el.value,e.kind)||0;
  el.value = Math.max(0, Math.round((cur+d)*100)/100);
  editSet(k, ix);
}

function railHTML(){
  return W.blocks.map((b,i)=>`<i class="${i<W.i?'done':i===W.i?'now':''}"></i>`).join('');
}

function wkRender(){
  if(!W)return;
  wkPersist();
  const wkEl=document.getElementById('wk');
  const body=document.getElementById('wkBody'), foot=document.getElementById('wkFoot');
  document.getElementById('wkRail').innerHTML=railHTML();

  /* ---------- SUMMARY ---------- */
  if(W.phase==='summary'){
    wkEl.className='on done';
    document.getElementById('wkTitle').textContent=W.plan.n;
    document.getElementById('wkStep').textContent='Complete';
    if(W.plan.half && W.rox>0 && W.results.roxzone==null) W.results.roxzone=W.rox;
    const ks=Object.keys(W.results);
    const hits=ks.filter(k=>isHit(k,W.results[k])).length;
    const total=Math.round((Date.now()-W.startedAt)/1000);
    body.innerHTML=`
    <div class="wk-kick" style="color:var(--green)">Session complete</div>
    <div class="wk-name">${hits}<span style="color:var(--muted)">/${ks.length}</span> hit</div>
    <div class="wk-sub">${fmt(total,'time')} total · ${W.plan.n}</div>
    <div class="wk-list">${ks.map(k=>{
      const v=W.results[k],h=isHit(k,v);
      const sp=W.splits[k];
      return `<div class="wk-li"><div class="dot ${h?'g':'r'}"></div>
      <div class="wk-li-n">${EX[k].n}${sp&&sp.length>1?`<div style="font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px">${sp.map(s=>fmt(s,'time')).join(' · ')}</div>`:''}</div>
      <div class="wk-li-v" style="color:${h?'var(--green)':'var(--red)'}">${fmt(v,EX[k].kind)}</div></div>`;
    }).join('')}</div>`;
    foot.innerHTML=`<button class="btn" onclick="wkSave()">Save session</button>
    <button class="btn gh sm" onclick="wkClose()">Discard</button>`;
    return;
  }

  const b=W.blocks[W.i], e=EX[b.k];

  /* ---------- REST ---------- */
  if(W.phase==='rest'){
    wkEl.className='on rest';
    body.classList.remove('multiset');
    const sameSt = W.sameStation===true;
    const nb = sameSt ? W.blocks[W.i] : W.blocks[W.i+1];
    document.getElementById('wkTitle').textContent=W.plan.n;
    document.getElementById('wkStep').textContent = sameSt ? 'Rest between sets' : 'Rest';
    body.innerHTML=`
    <div class="wk-kick">Rest</div>
    <div class="wk-time" id="wkTime">${fmt(Math.max(0,Math.ceil((W.restEnd-Date.now())/1000)),'time')}</div>
    <div class="wk-vs">${sameSt?'Same station':'Next up'}</div>
    <div class="wk-name" style="font-size:22px">${EX[nb.k].n}</div>
    <div class="wk-sub">${sameSt
      ? `Set ${((W.setsDone&&W.setsDone[nb.k])||0)+1} of ${setsOf(nb.k)} · Target ${fmt(targetOf(nb.k),EX[nb.k].kind)}`
      : `Station ${W.i+2} of ${W.blocks.length} · Target ${fmt(targetOf(nb.k),EX[nb.k].kind)}${EX[nb.k].load?' @ '+EX[nb.k].load+' '+EX[nb.k].loadUnit:''}`}</div>`;
    /* Between sets, show every set you have already done at this station. */
    if(sameSt){
      const k=nb.k, e=EX[k], a=(W.setData&&W.setData[k])||[];
      const unit = e.kind==='kg'?' kg':e.kind==='dist'?' km':e.kind==='time'?'':' reps';
      const rows = a.map((r,i)=> r ? `<div class="setsline"><b>Set ${i+1}</b>${
          r.t!=null?fmt(r.t,'time'):'—'}${r.v!=null?' · '+r.v+unit:''}</div>` : '').join('');
      if(rows) body.innerHTML += `<div class="prevsplit" style="margin-top:16px;text-align:left">
        <b style="font-size:11px;letter-spacing:.5px;color:var(--muted)">THIS STATION SO FAR</b>
        ${rows}</div>`;
    }
    if(W.plan.half){
      const rx=W.rox||0;
      // 16 transitions on race day. Project this session's pace across all 16.
      const perT = W.i>0 ? rx/W.i : 0;
      const proj = Math.round(perT*16);
      const tone = proj<=240?'g':proj<=400?'a':'r';
      body.innerHTML+=`<div class="prevsplit" style="margin-top:18px">
        Roxzone so far <b>${fmt(rx,'time')}</b>${W.i>0?` · ${Math.round(perT)}s per transition`:''}
        ${proj?`<br><span class="pill ${tone}" style="margin-top:7px">At this pace: ${fmt(proj,'time')} across 16</span>`:''}
      </div>`;
      if(W.plan.roxDrill){
        body.innerHTML+=`<div class="prevsplit" style="margin-top:10px;text-align:left;border-color:rgba(56,189,248,.3)">
          <b style="color:var(--blue)">Transition drill</b><br>
          <span style="font-size:11px;line-height:1.55">Keep moving — do not stand still. Know your grip before you arrive.
          Walk in, set up, go. Efficient athletes spend 8 s here; most spend 25 s. Across 16 transitions that is a 4–5 minute swing,
          more than you will gain from months of sled work.</span>
        </div>`;
      }
    }
    foot.innerHTML=`<button class="btn" onclick="wkNext()">${sameSt?'Start next set':'Skip rest · start now'}</button>
    <button class="btn gh sm" onclick="W.restEnd+=30000">+30 sec</button>`;
    return;
  }

  /* ---------- WORK ---------- */
  wkEl.className='on';
  body.classList.toggle('multiset', setsOf(b.k)>1);
  document.getElementById('wkTitle').textContent=W.plan.n;
  document.getElementById('wkStep').textContent=`Station ${W.i+1} of ${W.blocks.length}`;

  const t=targetOf(b.k);
  let prev='';
  const sp=W.splits[b.k];
  if(sp && sp.length){
    const ls=sp[sp.length-1];
    prev=`<div class="prevsplit">Your rep ${sp.length} this session: <b>${fmt(ls,'time')}</b></div>`;
  } else {
    const lo=latestOf(b.k);
    if(lo!=null) prev=`<div class="prevsplit">Last session: <b>${fmt(lo,EX[b.k].kind)}</b></div>`;
  }

  body.innerHTML=`
  ${W.blocks.length>5?`<div class="rounds">${W.blocks.map((bb,ix)=>
    `<div class="rd ${ix<W.i?'done':ix===W.i?'now':''}" style="width:26px;height:26px;font-size:11px">${ix+1}</div>`
    ).slice(Math.max(0,Math.min(W.i-2,W.blocks.length-5)),Math.max(5,Math.min(W.i+3,W.blocks.length))).join('')}</div>`:''}
  <div class="wk-kick">${GRP[e.grp].n}</div>
  <div class="wk-name">${e.n}</div>
  <div class="wk-sub">${e.load?`${e.load} ${e.loadUnit} · `:''}${e.note||W.plan.brief}</div>
  ${rxOf(b.k)?`<div class="rxbig">${rxOf(b.k)}</div>`:''}
  ${setPagerHTML(b.k)}
  ${(()=>{const n=setsOf(b.k);
     if(n<2) return '';
     const done=(W.setsDone&&W.setsDone[b.k])||0, live=Math.min(done,n-1);
     return setView(b.k)!==live ? '<div class="sp-peek">Timer still running</div>' : '';
   })()}
  ${(()=>{ if(!e.cue) return '';
     /* The cue is reference, not something to read mid-set. It collapses to a
        single button and opens only when asked. */
     const n=setsOf(b.k);
     if(n>1){ const done=(W.setsDone&&W.setsDone[b.k])||0, live=Math.min(done,n-1);
       if(setView(b.k)!==live) return ''; }
     return W.showCue
       ? `<div class="cuebox"><button class="cueclose" onclick="toggleCue()" aria-label="Hide form notes">×</button>
            <b>Form</b> ${e.cue}</div>`
       : `<button class="cuebtn" onclick="toggleCue()">Form notes</button>`;})()}
  <div class="wk-time${(()=>{const n=setsOf(b.k);if(n<2)return '';
     const done=(W.setsDone&&W.setsDone[b.k])||0,live=Math.min(done,n-1);
     return setView(b.k)!==live?' dim':'';})()}" id="wkTime">0:00</div>
  <div class="wk-vs">Target <b>${fmt(t,e.kind)}</b></div>
  ${prev}`;
  const nSets=setsOf(b.k);
  /* position the carousel once the panels exist and have real widths */
  if(nSets>1) requestAnimationFrame(()=>spPlace(setView(b.k), false));
  const sdone=(W.setsDone&&W.setsDone[b.k])||0;
  const lastSet = nSets<2 || sdone>=nSets-1;
  const viewing = nSets>1 ? setView(b.k) : 0;
  const live    = Math.min(sdone, nSets-1);
  /* If you swiped away to look at another set, the primary action returns you
     to the live set rather than finishing the wrong one. */
  foot.innerHTML = (nSets>1 && viewing!==live)
    ? `<button class="btn" onclick="W.viewSet=null;wkRender()">Back to set ${live+1}</button>
       <button class="btn gh sm" onclick="wkSkipStation()">Skip</button>`
    : `<button class="btn" onclick="wkDone()">${lastSet?'Finish station':'Finish set '+(sdone+1)+' of '+nSets}</button>
       <button class="btn gh sm" onclick="wkSkipStation()">Skip</button>`;
}

function wkSave(){
  const key=todayKey();
  const easy = W.plan.easy===true;
  /* carry the per-set detail into the log so Progress can show it */
  const sets={};
  Object.keys(W.setData||{}).forEach(k=>{
    const vals=(W.setData[k]||[]).map(r=>r&&r.v!=null?r.v:null).filter(v=>v!=null);
    if(vals.length) sets[k]=vals;
  });
  const times={};
  Object.keys(W.setData||{}).forEach(k=>{
    const ts=(W.setData[k]||[]).map(r=>r&&r.t!=null?r.t:null).filter(v=>v!=null);
    if(ts.length) times[k]=ts;
  });
  const ex=S.logs.find(l=>l.date===key);
  if(ex){ ex.results=Object.assign(ex.results||{},W.results); ex.name=W.plan.n;
    ex.sets=Object.assign(ex.sets||{},sets); ex.setTimes=Object.assign(ex.setTimes||{},times);
    if(easy)ex.easy=true; }
  else S.logs.push({date:key, week:weekNo(), name:W.plan.n, results:Object.assign({},W.results),
    sets:Object.keys(sets).length?sets:undefined,
    setTimes:Object.keys(times).length?times:undefined, easy:easy||undefined});
  save();
  const ks=Object.keys(W.results), hits=ks.filter(k=>isHit(k,W.results[k])).length;
  wkClose();
  toast(`Saved · ${hits}/${ks.length} target${ks.length===1?'':'s'} hit`);
}

/* ---------------- BOOT ----------------
   Runs last so wkStored() and friends exist when the first render happens;
   otherwise the "unfinished session" banner is silently skipped. */
load();
autoScale();
render();

/* ---- offline support -------------------------------------------------------
   sw.js was shipped to dist/ but never registered, so the installed PWA
   failed to open without a connection — the one situation it exists for.
   Registered only over http(s): a file:// or artifact-host page has no
   service worker scope and would throw. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      /* A new deployment should not wait for every tab to close. */
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            sw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(() => { /* offline support is a bonus; never break boot over it */ });
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    /* Never yank the page out from under a running workout. */
    if (typeof W !== 'undefined' && W) return;
    location.reload();
  });
}
</script>
