<script>
/* =====================================================================
   NAV
   ===================================================================== */
const TABS=[
 {id:'home',   n:'Home',    i:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>'},
 {id:'train',  n:'Train',   i:'<path d="M6.5 7v10M17.5 7v10M3 9.5v5M21 9.5v5M6.5 12h11"/>'},
 {id:'progress',n:'Progress',i:'<path d="M3 17l5.5-6 4 3.5L21 6"/><path d="M15 6h6v6"/>'},
 {id:'profile',n:'Profile', i:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.4-6 7.5-6s7.5 2 7.5 6"/>'},
 {id:'coach',  n:'Coach',   i:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.3-.5L3.5 21l1.4-4.2A8.2 8.2 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/>'},
];
let tab='home';
function renderTabs(){
  document.getElementById('tabbar').innerHTML=TABS.map(t=>
    `<button class="tab ${t.id===tab?'on':''}" onclick="go('${t.id}')">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${t.i}</svg>
     <span>${t.n}</span></button>`).join('');
}
function go(t){ tab=t; document.getElementById('scroll').scrollTop=0; render(); }

/* =====================================================================
   WEEK STRIP — 7 compact columns, horizontally scrollable, with
   week-to-week navigation so past and future are both reachable.
   ===================================================================== */
let weekOffset = 0;                       // 0 = this week, -1 = last, +1 = next
function shiftWeek(d){ weekOffset += d; render(); }
function weekStrip(now){
  const base = new Date(now.getTime() + weekOffset*7*864e5);
  const mon  = new Date(base); mon.setDate(base.getDate()-((base.getDay()+6)%7));
  const sun  = new Date(mon.getTime()+6*864e5);
  const label = weekOffset===0 ? 'This week'
              : weekOffset===-1 ? 'Last week'
              : weekOffset===1 ? 'Next week'
              : mon.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+
                sun.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  let cells='';
  for(let i=0;i<7;i++){
    const dd=new Date(mon.getTime()+i*864e5);
    const key=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
    const pl=dayPlan(dd), lg=S.logs.find(l=>l.date===key);
    const isToday=key===todayKey();
    const past = key < todayKey();
    // status: done (green) | missed (red, a past training day with no log) | today | planned | rest
    let cls='m', mark='';
    if(lg && lg.easy){cls='b';mark='~';}          // easy / substitute day
    else if(lg){cls='g';mark='✓';}
    else if(isToday && pl.ex.length){cls='a';mark='•';}
    else if(past && pl.ex.length){cls='r';mark='—';}
    else if(pl.ex.length){cls='m';mark='';}
    const short = pl.ex.length ? pl.n.replace(/ \+ /,'+').split(' ').slice(0,2).join(' ') : 'Rest';
    cells+=`<div class="wcell${isToday?' now':''}">
      <div class="wdow">${dowName(dd)}</div>
      <div class="wdate">${dd.getDate()}</div>
      <div class="wdot ${cls}">${mark}</div>
      <div class="wname">${short}</div>
    </div>`;
  }
  return `<div class="card" style="padding:12px 0 10px">
    <div class="wnav">
      <button onclick="shiftWeek(-1)" aria-label="Previous week">‹</button>
      <span>${label}</span>
      <button onclick="shiftWeek(1)" aria-label="Next week">›</button>
    </div>
    <div class="wrow">${cells}</div>
    ${weekOffset!==0?`<div style="text-align:center;margin-top:10px"><button class="btn gh sm" style="width:auto;padding:7px 14px" onclick="weekOffset=0;render()">Back to this week</button></div>`:''}
  </div>`;
}

/* =====================================================================
   HOME — premium overview
   ===================================================================== */
function vHome(){
  const now=new Date(), w=weekNo(), bl=blockOf(w), d=daysTo(RACE);
  const p=S.profile, plan=dayPlan(now);
  const all=hitRate(S.logs);
  const done=S.logs.length;
  const thisWeek=weekLogs(w).length;
  const hrs=['Good night','Good morning','Good afternoon','Good evening'];
  const h=now.getHours();
  const greet= h<5?hrs[0] : h<12?hrs[1] : h<18?hrs[2] : hrs[3];
  const loggedToday=S.logs.some(l=>l.date===todayKey());
  const wt=S.weights.length?S.weights[S.weights.length-1].kg:null;
  const wtFirst=S.weights.length?S.weights[0].kg:null;

  const pj=projectRace();
  const vsField=pj.secs-FIELD_FINISH;
  const pc = vsField<=0?'g':vsField<600?'':'r';

  let o='';
  o+=`<div class="hero">
  <div class="hero-k">${greet}${p.name?', '+p.name.split(' ')[0]:''}</div>
  <div class="hero-h">${loggedToday?'Session logged':plan.ex.length?plan.n:'Rest day'}</div>
  <div class="hero-s">${loggedToday?'Done for today. '+plan.brief:plan.brief}</div>
  <div class="hero-row">
    <span class="chip g"><em>${bl.done?'—':d}</em><span>${bl.done?'Race done':'Days out'}</span></span>
    <span class="chip"><em>${bl.done?'—':bl.out}</em><span>Weeks left</span></span>
    <span class="chip"><em>${bl.i}<s style="font-size:12px;color:var(--muted);text-decoration:none;font-weight:700">/4</s></em><span>Block</span></span>
  </div>
  ${plan.ex.length?`<button class="btn" style="margin-top:16px" onclick="wkStart()">${loggedToday?'Train again':'Start '+plan.n}</button>
    <div style="display:flex;gap:8px;margin-top:9px">
      <button class="btn gh sm" style="flex:1" onclick="openLog()">Enter manually</button>
      <button class="btn gh sm" style="flex:1" onclick="openEasy()">Not feeling it</button>
    </div>`:
    `<div style="margin-top:14px"><button class="btn gh sm" onclick="openEasy()">Log something anyway</button></div>`}
  </div>`;

  o+=`<div class="sec">At a glance</div>
  <div class="card" style="padding:16px" onclick="go('coach')">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div><div class="stat-v ${pc} mono" style="font-size:31px">${fmtClock(pj.secs)}</div>
      <div class="stat-l" style="text-align:left;margin-top:8px">Projected finish</div></div>
      <div style="text-align:right"><span class="pill ${pc==='g'?'g':pc==='r'?'r':'m'}">${vsField<=0?'−':'+'}${fmtClock(Math.abs(vsField))} vs field</span>
      <div style="font-size:10.5px;color:var(--muted);margin-top:8px;font-weight:600">${pj.known}/${pj.total} from your data</div></div>
    </div>
    ${pj.assumed?`<div style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:12px;padding-top:12px;border-top:.5px solid var(--border)">${pj.assumed} element${pj.assumed===1?'':'s'} still using field averages. Log them and this number becomes real.</div>`:''}
  </div>
  <div class="sgrid">
    <div class="stat"><div class="stat-v ${all?(all.pct>=90?'g':all.pct>=70?'':'r'):'w'}">${all?all.pct+'<u>%</u>':'—'}</div><div class="stat-l">Hit rate</div></div>
    <div class="stat"><div class="stat-v w">${done}</div><div class="stat-l">Sessions</div></div>
  </div>
  <div class="sgrid c3" style="margin-top:9px">
    <div class="stat"><div class="stat-v sm w">${thisWeek}<s>/3</s></div><div class="stat-l">This week</div></div>
    <div class="stat"><div class="stat-v sm w">${wt?wt+'<u>kg</u>':'—'}</div><div class="stat-l">Weight</div></div>
    <div class="stat"><div class="stat-v sm w">${Object.keys(EX).filter(k=>latestOf(k)!=null).length}<s>/${Object.keys(EX).length}</s></div><div class="stat-l">Tracked</div></div>
  </div>`;

  // ---- week strip: horizontal, compact, scrolls through past and future ----
  o+=`<div class="sec">Your week</div>`;
  o+=weekStrip(now);

  if(backupDue()){
    o+=`<div class="card" style="border-color:rgba(245,158,11,.35)">
    <div class="card-t" style="color:var(--amber)">Back up your training</div>
    <p style="font-size:13px;color:var(--muted2);line-height:1.55;margin-bottom:13px">${S.logs.length} sessions live only in this browser. One cleared cache and they are gone.</p>
    <button class="btn sm" onclick="exportData()">Back up now</button></div>`;
  }

  if(!p.name){
    o+=`<div class="card" style="border-color:rgba(255,215,0,.3)">
    <div class="card-t" style="color:var(--gold)">Set up your profile</div>
    <p style="font-size:13px;color:var(--muted2);line-height:1.55;margin-bottom:13px">Height, weight and age let me scale loads and read your progress properly.</p>
    <button class="btn sm" onclick="go('profile')">Add details</button></div>`;
  }
  return o;
}

/* =====================================================================
   TRAIN
   ===================================================================== */
function vTrain(){
  const now=new Date(), plan=dayPlan(now), w=weekNo(), bl=blockOf();
  const loggedToday=S.logs.some(l=>l.date===todayKey());

  /* ---- unfinished workout waiting to be resumed ---- */
  let o='';
  const stored=(typeof wkStored==='function')?wkStored():null;
  if(stored){
    const mins=Math.max(1,Math.round((Date.now()-stored.savedAt)/60000));
    const nDone=Object.keys(stored.results||{}).length;
    o+=`<div class="card" style="border-color:rgba(245,158,11,.4);padding:15px 16px">
      <div class="card-t" style="color:var(--amber)">Unfinished session</div>
      <div style="font-size:13px;color:var(--muted2);line-height:1.55;margin-bottom:13px">
      ${stored.plan.n} — paused ${mins} min ago${nDone?`, ${nDone} exercise${nDone>1?'s':''} logged`:''}.</div>
      <button class="btn sm" onclick="wkResume()">Resume</button>
      <button class="btn gh sm" style="margin-top:8px" onclick="wkDiscardStored()">Discard</button>
    </div>`;
  }

  /* ---- race countdown, moved here from Coach ---- */
  o+=`<div class="card" style="padding:14px 16px;margin-bottom:12px" onclick="go('coach')">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <div><span style="font-weight:800;font-size:19px;letter-spacing:-.5px;color:var(--gold)">${bl.done?'✓':bl.out}</span>
      <span style="font-weight:700;font-size:12px;color:var(--muted);margin-left:5px">${bl.done?'race complete':'weeks to race'}</span></div>
      <span class="pill m">${bl.n}</span>
    </div>
    <div class="bar" style="margin-top:10px"><i style="width:${bl.done?100:Math.min(100,Math.max(3,(1-bl.out/19)*100))}%"></i></div>
    <div style="font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px">${bl.f}</div>
  </div>`;

  /* ---- today's session ---- */
  o+=`<div class="hero">
    <div class="hero-k">${longDate(now)}</div>
    <div class="hero-h">${plan.n}</div>
    <div class="hero-s">${plan.brief}</div>
    <div class="hero-row pills"><span class="chip g" style="background:rgba(255,215,0,.13);border-color:rgba(255,215,0,.3);color:var(--gold)">${plan.tag}</span><span class="chip">${plan.ex.length} exercise${plan.ex.length===1?'':'s'}</span>${loggedToday?'<span class="chip" style="background:rgba(32,166,118,.16);border-color:rgba(32,166,118,.35);color:var(--green)">Logged</span>':''}</div>
    ${plan.ex.length?`<button class="btn" style="margin-top:16px" onclick="wkStart()">${loggedToday?'Train again':'Start workout'}</button>
    <div style="display:flex;gap:8px;margin-top:9px">
      <button class="btn gh sm" style="flex:1" onclick="openLog()">Enter manually</button>
      <button class="btn gh sm" style="flex:1" onclick="openEasy()">Not feeling it</button>
    </div>`:
    `<div style="margin-top:14px"><button class="btn gh sm" onclick="openEasy()">Log something anyway</button></div>`}
  </div>`;

  if(plan.ex.length){
    o+=`<div class="sec">Today's targets</div>`;
    plan.ex.forEach((k,i)=>{
      const e=EX[k], t=targetOf(k), b=bestOf(k);
      const beat = b!=null && (e.dir==='lower' ? b<=t : b>=t);
      const inCircuit = plan.circuitFrom!=null && i>=plan.circuitFrom;
      const rx=rxOf(k);
      o+=`<div class="row lead" onclick="openEx('${k}')"><div class="row-main">
      <div class="row-t">${e.n}${inCircuit?' <span class="pill a" style="margin-left:5px;padding:2px 6px;font-size:9px">CIRCUIT</span>':''}</div>
      ${rx?`<div class="rxline">${rx}</div>`:''}
      <div class="row-s">${e.load?e.load+' '+e.loadUnit+' · ':''}${b==null?(e.est?'Estimate — no data yet':'No data yet'):beat?'Your best — beat it today':'Best '+fmt(b,e.kind)}</div>
      </div><div class="row-r"><div class="row-v mono">${fmt(t,e.kind)}</div><div class="row-vs">TARGET</div></div>
      <svg class="caret" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l6 6-6 6"/></svg></div>`;
    });
  }

  /* ---- last session and what's next ---- */
  const prev=S.logs.filter(l=>l.date<todayKey()).sort((a,b)=>a.date<b.date?1:-1)[0];
  let nd=null;
  for(let i=1;i<=7;i++){
    const d=new Date(now.getTime()+i*864e5);
    if(dayPlan(d).ex.length){ nd={d, plan:dayPlan(d)}; break; }
  }
  o+=`<div class="sec">Around today</div><div class="card">`;
  if(prev){
    const ks=Object.keys(prev.results||{});
    const hits=ks.filter(k=>isHitAsOf(k,prev.results[k],prev.date)).length;
    o+=`<div style="display:flex;align-items:center;gap:11px;padding:4px 0 12px;border-bottom:.5px solid var(--border)">
      <div class="dot g"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13.5px">${prev.name}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${longDate(new Date(prev.date+'T12:00:00'))} · ${hits}/${ks.length} targets hit</div>
      </div>
      <span class="pill ${hits/Math.max(1,ks.length)>=0.7?'g':'r'}">${Math.round(hits/Math.max(1,ks.length)*100)}%</span>
    </div>`;
  } else {
    o+=`<div style="padding:4px 0 12px;border-bottom:.5px solid var(--border);font-size:12.5px;color:var(--muted)">No previous session logged yet.</div>`;
  }
  if(nd){
    o+=`<div style="display:flex;align-items:center;gap:11px;padding:12px 0 4px">
      <div class="dot m"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13.5px;color:var(--muted2)">Next: ${nd.plan.n}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${longDate(nd.d)} · ${nd.plan.tag}</div>
      </div>
    </div>`;
  }
  o+=`</div>`;

  o+=`<p style="font-size:12px;color:var(--muted);line-height:1.6;margin:16px 2px 0">
  Every exercise and its history lives in <b style="color:var(--muted2)">Progress</b>.</p>`;
  return o;
}

/* =====================================================================
   PROGRESS — graph per exercise
   ===================================================================== */
let pGrp='all', pRange='all', pOpen=null;
function togglePx(k){ pOpen = (pOpen===k?null:k); render(); }

function vProgress(){
  const anyData=Object.keys(EX).some(k=>histOf(k).length>0);
  let o='';

  const groups=[['all','All']].concat(Object.keys(GRP).map(g=>[g,GRP[g].n.split(' ')[0]]));
  o+=`<div class="seg">${groups.map(([g,n])=>
    `<button class="${g===pGrp?'on':''}" onclick="pGrp='${g}';pOpen=null;render()">${n}</button>`).join('')}</div>`;

  if(!anyData){
    o+=`<div class="empty"><b>No data yet</b><p>Log a session and every exercise you train appears here with its history \u2014 latest, best, and the trend against your target.</p>
    <button class="btn" style="margin-top:18px;max-width:220px" onclick="go('train')">Go to today's session</button></div>`;
    return o;
  }

  const keys=Object.keys(EX).filter(k=>pGrp==='all'||EX[k].grp===pGrp);
  keys.sort((a,b)=>{const ha=histOf(a).length?1:0, hb=histOf(b).length?1:0; return hb-ha;});

  o+=`<div class="sec">Every exercise</div>
  <p style="font-size:12px;color:var(--muted);line-height:1.55;margin:-4px 2px 12px">Tap any row for its full history.</p>`;

  let lastGrp=null;
  keys.forEach(k=>{
    const e=EX[k], h=histOf(k), l=latestOf(k), b=bestOf(k), t=targetOf(k), ip=improvePct(k);
    if(pGrp==='all' && e.grp!==lastGrp){
      lastGrp=e.grp;
      o+=`<div class="gtitle" style="color:${GRP[e.grp].c}"><i style="background:${GRP[e.grp].c}"></i>${GRP[e.grp].n}</div>`;
    }
    const open = pOpen===k;
    const trend = ip==null ? null : (ip>0.5?'g':ip<-0.5?'r':'m');
    o+=`<div class="prow${open?' open':''}" onclick="togglePx('${k}')">
      <div class="prow-n">
        <div class="row-t">${e.n}</div>
        <div class="row-s">${h.length?h.length+' session'+(h.length>1?'s':'')+' \u00b7 best '+fmt(b,e.kind):(e.est?'Field estimate \u2014 not your data':'Not logged yet')}</div>
      </div>
      <div class="prow-v">
        <div class="row-v mono" style="color:${l==null?'var(--muted)':'var(--white)'}">${l==null?'\u2014':fmt(l,e.kind)}</div>
        <div class="row-vs">${l==null?'':'LATEST'}</div>
      </div>
      <div class="prow-t">${ip!=null?`<span class="pill ${trend}">${ip>0?'\u2191':ip<0?'\u2193':''}${Math.abs(ip).toFixed(1)}%</span>`:`<span class="pill ${e.est?'a':'m'}">${e.est?'Est':'New'}</span>`}</div>
    </div>`;
    if(open){
      o+=`<div class="card pexp">
        ${h.length?`<div class="seg" style="margin-bottom:12px">
          ${[['30','30d'],['90','90d'],['all','All']].map(r=>`<button class="${pRange===r[0]?'on':''}" onclick="event.stopPropagation();pRange='${r[0]}';render()">${r[1]}</button>`).join('')}
        </div>${lineChart(k,pRange)}
        <div class="hr"></div>
        <div class="sgrid c3">
          <div style="text-align:center"><div class="mono" style="font-weight:800;font-size:14px;color:var(--gold)">${fmt(t,e.kind)}</div><div class="stat-l">Target</div></div>
          <div style="text-align:center"><div class="mono" style="font-weight:800;font-size:14px">${fmt(b,e.kind)}</div><div class="stat-l">Best</div></div>
          <div style="text-align:center"><div class="mono" style="font-weight:800;font-size:14px;color:var(--muted)">${fmt(e.base,e.kind)}</div><div class="stat-l">Baseline</div></div>
        </div>
        ${(()=>{const withSets=S.logs.filter(l=>l.sets&&l.sets[k]&&l.sets[k].length>1)
            .sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
          if(!withSets.length) return '';
          return `<div class="hr"></div><div class="card-t">Recent sets</div>`+
            withSets.map(l=>`<div class="setsline"><b>${l.date.slice(5).replace('-','/')}</b> ${l.sets[k].map(v=>fmt(v,e.kind)).join(' · ')}</div>`).join('');
        })()}`:`<p style="font-size:12.5px;color:var(--muted);line-height:1.6;padding:4px 0 10px">
          ${e.est?`No data from you yet \u2014 the plan is using the Open men's field average of <b style="color:var(--muted2)">${fmt(e.base,e.kind)}</b>. Log it once and this becomes your number.`:`Nothing logged yet. Baseline is <b style="color:var(--muted2)">${fmt(e.base,e.kind)}</b>.`}
        </p>`}
        <button class="btn gh sm" style="margin-top:12px" onclick="event.stopPropagation();openEx('${k}')">Log ${e.n}</button>
      </div>`;
    }
  });
  return o;
}
</script>
<script>
/* =====================================================================
   PROFILE — body report
   ===================================================================== */
function vProfile(){
  const p=S.profile;
  const wt=S.weights.length?S.weights[S.weights.length-1].kg:p.weight;
  const first=S.weights.length?S.weights[0].kg:null;
  const bmi=(wt&&p.height)?(wt/Math.pow(p.height/100,2)):null;
  const delta=(wt&&first)?wt-first:null;
  let o='';

  o+=`<div class="hero">
  <div class="hero-k">Athlete profile</div>
  <div class="hero-h">${p.name||'Set up your profile'}</div>
  <div class="hero-s">${p.name?`${p.age?p.age+' years · ':''}${p.height?p.height+' cm · ':''}${wt?wt+' kg':''} · Hyrox Open`:'Height, weight and age let me scale loads and read your numbers properly.'}</div>
  <div style="margin-top:15px"><button class="btn ${p.name?'alt':''} sm" style="width:auto;padding:10px 18px" onclick="openProfile()">${p.name?'Edit details':'Add details'}</button></div>
  </div>`;

  if(p.name){
    o+=`<div class="sec">Body report</div><div class="sgrid c3">
    <div class="stat"><div class="stat-v sm w">${wt?wt+'<u>kg</u>':'—'}</div><div class="stat-l">Current</div></div>
    <div class="stat"><div class="stat-v sm ${delta==null?'w':delta<0?'g':''}">${delta==null?'—':(delta>0?'+':'')+delta.toFixed(1)}</div><div class="stat-l">Change</div></div>
    <div class="stat"><div class="stat-v sm w">${bmi?bmi.toFixed(1):'—'}</div><div class="stat-l">BMI</div></div>
    </div>`;

    /* bi-weekly weigh-in cadence */
    const lastW = S.weights.length?S.weights[S.weights.length-1]:null;
    const daysSince = lastW ? Math.floor((new Date()-new Date(lastW.d+'T12:00:00'))/864e5) : null;
    const due = daysSince==null || daysSince>=14;
    o+=`<div class="card" style="margin-top:12px${due?';border-color:rgba(245,158,11,.35)':''}">
      <div class="card-t"${due?' style="color:var(--amber)"':''}>Weight trend · every 2 weeks</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;margin:-6px 0 12px">
      ${lastW?`Last weighed ${daysSince===0?'today':daysSince===1?'yesterday':daysSince+' days ago'}.${due?' Due now — weigh yourself first thing, before eating.':''}`
            :'No weigh-ins yet. Weigh first thing in the morning, before eating, same day every fortnight.'}</div>
      ${weightChart()}
    <button class="btn gh sm" style="margin-top:13px" onclick="openWeight()">Log weight</button></div>`;

    // relative strength
    if(wt){
      o+=`<div class="sec">Relative strength</div>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.55;margin:-4px 2px 12px">Strength per kilo of body weight — what actually moves a sled.</p>`;
      [['squat',1.7],['row_bb',1.0],['ohp',0.9],['kbswing',0.4]].forEach(([k,goal])=>{
        const v=latestOf(k)||EX[k].base; const r=v/wt; const pctg=Math.min(100,r/goal*100);
        o+=`<div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:700;font-size:13.5px;line-height:1">${EX[k].n.replace(' 5RM','').replace(' 8RM','')}</span>
        <span class="mono" style="font-weight:800;font-size:14px;line-height:1;color:var(--gold)">${r.toFixed(2)}×</span></div>
        <div class="bar"><i class="${pctg>=100?'g':''}" style="width:${pctg}%"></i></div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:7px;font-weight:600">${v} kg of ${wt} kg · Hyrox-ready target ${goal}×</div></div>`;
      });
    }
  }

  // station coverage
  o+=`<div class="sec">Race station coverage</div>`;
  const hx=Object.keys(EX).filter(k=>EX[k].grp==='hyrox');
  const covered=hx.filter(k=>latestOf(k)!=null).length;
  o+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">
  <span style="font-weight:700;font-size:14px;line-height:1">${covered} of ${hx.length} stations logged</span>
  <span class="mono" style="font-weight:800;font-size:17px;line-height:1;color:${covered===hx.length?'var(--green)':'var(--gold)'}">${Math.round(covered/hx.length*100)}%</span></div>
  <div class="bar"><i class="${covered===hx.length?'g':''}" style="width:${covered/hx.length*100}%"></i></div>
  <div style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5">${covered===hx.length?'Every station has data. The plan is working from real numbers.':'Stations with no data are guesses in your plan. Get one number on each.'}</div></div>`;
  hx.forEach(k=>{
    const l=latestOf(k);
    o+=`<div class="row" onclick="openEx('${k}')"><div class="dot ${l!=null?'g':'r'}"></div>
    <div class="row-main"><div class="row-t">${EX[k].n}</div>
    <div class="row-s">${l!=null?'Logged · '+fmt(l,EX[k].kind):'No data — plan is estimating'}</div></div>
    <svg class="caret" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l6 6-6 6"/></svg></div>`;
  });

  o+=`<div class="sec">Data</div>
  <div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px"><span style="color:var(--muted)">Sessions logged</span><b>${S.logs.length}</b></div>

  <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:9px"><span style="color:var(--muted)">Last backup</span><b>${S.settings.lastBackupCount!=null?'at '+S.settings.lastBackupCount+' sessions':'never'}</b></div>
  <div class="hr"></div>
  <button class="btn gh sm" onclick="openHistory()">Session history</button>
  <button class="btn ${backupDue()?'':'gh'} sm" style="margin-top:9px" onclick="exportData()">Back up my training</button>
  <button class="btn gh sm" style="margin-top:9px" onclick="openRestore()">Restore from backup</button>
  <button class="btn gh sm" style="margin-top:9px;color:var(--red);border-color:rgba(239,68,68,.35)" onclick="resetAll()">Reset everything</button></div>`;

  o+=`<p style="font-size:12px;color:var(--muted);line-height:1.6;margin:14px 2px 0">Your training is stored only in this browser. Clearing Safari data erases it. Back up every few weeks and keep the file somewhere you will find it.</p>`;
  return o;
}

/* =====================================================================

function vCoach(){

  const sc=autoScale();
  let o='';
  o+=`<div class="hero">
  <div class="hero-k">Analysis</div>

    <div style="font-size:12px;color:var(--muted);line-height:1.5">${pl.brief}</div></div>`;

  /* ---- the road to race day ---- */
  o+=`<div class="sec">The road to 1 March</div><div class="card">`;
  [[1,'Base','15+ weeks out','Build the aerobic floor and the strength underneath the stations. Log every station once so nothing is a guess.'],
   [2,'Build','14–9 weeks out','Volume and intensity climb together. Half simulations every Friday.'],
   [3,'Simulation','8–5 weeks out','Game speed. Longer race-order sims — this is where pacing is learned.'],
   [4,'Peak','4–2 weeks out','Taper. Same intensity, half the volume. Fitness is banked; now you sharpen.'],
   [5,'Race week','Final 7 days','Movement and rehearsal only. Nothing you do now adds fitness.']
  ].forEach(([i,n,when,what],ix)=>{
    const cur=bl.i===i, past=bl.i>i;
    o+=`<div style="display:flex;gap:11px;padding:12px 0;${ix<4?'border-bottom:.5px solid var(--border)':''}">

      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">

  const rxNow=bestOf('roxzone');
  o+=`<div class="sec">Why this plan</div>
  <div class="card">
    <div class="coach-p"><b>Running is ${runShare}% of your race.</b> Stations are about a third. A study of recreational
    Hyrox athletes found finish time tracked VO2max and endurance volume closely, while grip strength and
    resistance-training volume showed no significant relationship — and station time correlated with nothing at all.
    One second per kilometre off your run pace is eight seconds off race day. One second off a station is one second.</div>
    <div class="coach-p"><b>Two hard days, not three.</b> Monday and Friday. Coaching sources converge on two
    high-intensity sessions a week with at least 48 hours between, and 70–80% of training genuinely easy.
    Tuesday and Thursday are easy on purpose — that is where the aerobic engine is built.</div>
    <div class="coach-p"><b>Strength stays, but for a different reason.</b> Heavy lifting is not what makes your sled
    faster. It preserves leg stiffness and power so your running holds up in the back half, when races are lost.</div>
    ${rxNow!=null?`<div class="coach-p"><b>Your Roxzone is ${fmt(rxNow,'time')}.</b> Efficient athletes cover 16 transitions
    in 2–3 minutes. That is the cheapest time on the course — no fitness required, just not standing still.</div>`:''}
  </div>

  <div class="sec">Scaling rules</div><div class="card">
  <div class="coach-p" style="margin-bottom:11px"><b>90% or more targets hit</b> → targets tighten 3% next week.</div>
  <div class="coach-p" style="margin-bottom:11px"><b>70–90% hit</b> → targets hold. This is the productive zone.</div>
  <div class="coach-p" style="margin-bottom:11px"><b>Under 70% hit</b> → targets ease 3%. Calibration, not failure.</div>
  <div class="coach-p" style="padding-top:11px;border-top:.5px solid var(--border)">Targets move once a week at most, and only for exercises you logged. Your own best is always the reference — never a number from someone else's race.</div></div>`;
  return o;
}

/* =====================================================================
   SHEETS — logging
   ===================================================================== */
let shMode=null, shKeys=[];
function openSheet(){ document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); shMode=null; }

function fieldHTML(k){
  const e=EX[k], t=targetOf(k), l=latestOf(k);
  const ph = e.kind==='time' ? 'e.g. 1:18' : e.kind==='kg' ? 'kg' : e.kind==='dist' ? 'km' : 'reps';
  const un = e.kind==='time'?'mm:ss':e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps';
  const nSets = setsOf(k), reps = repsOf(k);
  const mach = machineOf(k), mv = savedMachine(k);

  /* machine settings — remembered, pre-filled, collapsed by default */
  const machHTML = mach ? `
  <div class="machbox">
    <div class="machhead" onclick="toggleMach('${k}')">
      <span>${mach.n}</span>
      <span class="machsum" id="msum_${k}">${machineSummary(k)||'Tap to set'}</span>
    </div>
    <div class="machfields" id="mf_${k}" style="display:none">
      ${mach.fields.map(f=>`<div class="machrow">
        <label>${f.label}<em>${f.hint}</em></label>
        <input type="number" inputmode="decimal" step="any" id="m_${k}_${f.k}"
          value="${mv[f.k]!=null?mv[f.k]:''}" placeholder="${f.ph}" oninput="machChanged('${k}')">
      </div>`).join('')}
      <div class="machnote">Remembered for next time. A time only means something next to the setting it was set at.</div>
    </div>
  </div>` : '';

  /* per-set rows when the prescription calls for more than one */
  let setsHTML='';
  if(nSets>1){
    setsHTML = `<div class="sets" id="sets_${k}">
      ${Array.from({length:nSets},(_,i)=>`
        <div class="setrow" id="sr_${k}_${i}">
          <button class="settick" id="st_${k}_${i}" onclick="toggleSet('${k}',${i})" aria-label="Set ${i+1}">${i+1}</button>
          <input ${e.kind==='time'?'type="text" inputmode="numeric"':'type="number" inputmode="decimal" step="any"'}
            id="sv_${k}_${i}" placeholder="${reps&&e.kind!=='time'?e.kind==='kg'?'kg':reps:ph}"
            oninput="setChanged('${k}')">
          <span class="setunit">${un}</span>
        </div>`).join('')}
      <div class="setsdone" id="sd_${k}">0 of ${nSets} sets logged</div>
    </div>`;
  }

  return `<div class="field">
  <div class="flabel"><span>${e.n}</span><span>Target ${fmt(t,e.kind)}${e.load?' @ '+e.load+' '+e.loadUnit:''}</span></div>
  ${rxOf(k)?`<div class="rxbox">${rxOf(k)}</div>`:''}
  ${machHTML}
  ${nSets>1 ? setsHTML : `<div class="inrow">
    <input ${e.kind==='time'?'type="text" inputmode="numeric"':'type="number" inputmode="decimal" step="any"'}
      id="in_${k}" placeholder="${ph}" oninput="liveFB('${k}')" onchange="liveFB('${k}')">
    <div class="unit">${un}</div>
  </div>`}
  <div class="fb" id="fb_${k}">${l!=null?'Last session '+fmt(l,e.kind):'No previous data'}</div>
  ${e.cue?`<div style="margin-top:9px;padding:11px 13px;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.22);border-radius:12px">
    <div style="font-weight:800;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--blue);margin-bottom:5px">Form</div>
    <div style="font-size:11.5px;line-height:1.55;color:var(--muted2)">${e.cue}</div></div>`:''}
  </div>`;
}

function toggleMach(k){
  const el=document.getElementById('mf_'+k);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function machChanged(k){
  const m=machineOf(k); if(!m) return;
  const vals={};
  m.fields.forEach(f=>{const el=document.getElementById('m_'+k+'_'+f.k); if(el&&el.value!=='') vals[f.k]=parseFloat(el.value);});
  saveMachine(k, vals); save();
  const sum=document.getElementById('msum_'+k);
  if(sum) sum.textContent = machineSummary(k, vals) || 'Tap to set';
}
/* mark a set done without typing a value — uses the prescribed number */
function toggleSet(k,i){
  const btn=document.getElementById('st_'+k+'_'+i);
  const inp=document.getElementById('sv_'+k+'_'+i);
  const on=btn.classList.toggle('on');
  if(on && !inp.value){
    const e=EX[k];
    // default to the target for a timed/loaded lift, or the prescribed reps
    inp.value = e.kind==='time' ? fmt(targetOf(k),'time')
              : e.kind==='kg'   ? targetOf(k)
              : (repsOf(k)||targetOf(k));
  }
  if(!on) inp.value='';
  setChanged(k);
}
function setChanged(k){
  const n=setsOf(k); let done=0; const vals=[];
  for(let i=0;i<n;i++){
    const inp=document.getElementById('sv_'+k+'_'+i);
    const btn=document.getElementById('st_'+k+'_'+i);
    if(!inp) continue;
    const has = inp.value.trim()!=='';
    if(btn) btn.classList.toggle('on', has);
    if(has){ done++; const v=parseVal(inp.value, EX[k].kind); if(v!=null) vals.push(v); }
  }
  const sd=document.getElementById('sd_'+k);
  if(sd){
    sd.textContent = done+' of '+n+' sets logged'+(done===n?' — complete':'');
    sd.className = 'setsdone'+(done===n?' done':'');
  }
  // feed the best set into the normal feedback line
  if(vals.length){
    const e=EX[k];
    const best = e.dir==='lower'?Math.min(...vals):Math.max(...vals);
    liveFBValue(k, best);
  } else {
    const el=document.getElementById('fb_'+k); const l=latestOf(k);
    if(el){ el.className='fb'; el.textContent = l!=null?'Last session '+fmt(l,EX[k].kind):'No previous data'; }
  }
}

function liveFB(k){
  const e=EX[k];
  const inp=document.getElementById('in_'+k);
  liveFBValue(k, inp?parseVal(inp.value, e.kind):null);
}
function liveFBValue(k, v){
  const e=EX[k], el=document.getElementById('fb_'+k);
  if(!el) return;
  if(v==null){ const l=latestOf(k); el.className='fb'; el.textContent=l!=null?'Last session '+fmt(l,e.kind):'No previous data'; return; }
  const chk=sane(k,v);
  if(!chk.ok){ el.className='fb r'; el.textContent='⚠ '+chk.why; return; }
  const t=targetOf(k), hit=isHit(k,v);
  const diff=Math.abs(v-t), dp=t?Math.abs((v-t)/t*100):0;
  if(hit){
    el.className='fb g';
    el.textContent = dp<0.5 ? `Target hit — exactly on ${fmt(t,e.kind)}` :
      `Target hit — ${e.dir==='lower'?fmt(diff,e.kind)+' faster':'+'+fmt(diff,e.kind).replace('—','')+' over'} (${dp.toFixed(1)}% better)`;
  } else {
    el.className = dp<=3?'fb a':'fb r';
    el.textContent = dp<=3 ? `Just short — ${dp.toFixed(1)}% off ${fmt(t,e.kind)}. Close enough to count as calibrated.` :
      `Missed by ${dp.toFixed(1)}% — target is ${fmt(t,e.kind)}. Logged honestly, targets adjust.`;
  }
}

function openLog(){
  const plan=dayPlan(new Date());
  if(!plan.ex.length){ toast('Rest day — nothing scheduled'); return; }
  shMode='session'; shKeys=plan.ex.slice();
  document.getElementById('shTitle').textContent=plan.n;
  document.getElementById('shSub').textContent=`Week ${weekNo()} · ${longDate(new Date())} · ${plan.tag}`;
  document.getElementById('shBody').innerHTML=shKeys.map(fieldHTML).join('')+'<div style="height:6px"></div>';
  document.getElementById('shFoot').innerHTML=`<button class="btn" onclick="saveSession()">Save session</button>`;
  openSheet();
}
function openEx(k){
  shMode='single'; shKeys=[k];
  document.getElementById('shTitle').textContent=EX[k].n;
  document.getElementById('shSub').textContent=`${GRP[EX[k].grp].n} · ${histOf(k).length} session${histOf(k).length===1?'':'s'} logged`;
  document.getElementById('shBody').innerHTML=fieldHTML(k)+
    (histOf(k).length?`<div class="card" style="padding:14px"><div class="card-t">Progress</div>${lineChart(k,'all')}</div>`:'')+
    '<div style="height:6px"></div>';
  document.getElementById('shFoot').innerHTML=`<button class="btn" onclick="saveSession()">Save result</button>`;
  openSheet();
}
function saveSession(){
  const res={}; let n=0;
  const setDetail={}, rejected=[];
  shKeys.forEach(k=>{
    const e=EX[k];
    const nSets=setsOf(k);
    if(nSets>1){
      const vals=[];
      for(let i=0;i<nSets;i++){
        const si=document.getElementById('sv_'+k+'_'+i);
        if(!si) continue;
        const sv=parseVal(si.value, e.kind);
        if(sv!=null&&sv>0) vals.push(sv);
      }
      const bad=vals.find(v=>!sane(k,v).ok);
      if(bad!=null){ rejected.push(e.n+': '+sane(k,bad).why); }
      else if(vals.length){
        res[k] = e.dir==='lower'?Math.min(...vals):Math.max(...vals);
        setDetail[k] = vals;        // keep every set, not just the best
        n++;
      }
    } else {
      const el=document.getElementById('in_'+k); if(!el)return;
      const v=parseVal(el.value, e.kind);
      if(v!=null&&v>0){
        const chk=sane(k,v);
        if(!chk.ok){ rejected.push(e.n+': '+chk.why); }
        else { res[k]=v; n++; }
      }
    }
  });
  if(rejected.length){ toast(rejected[0]); return; }
  if(!n){ toast('Enter at least one result'); return; }
  const key=todayKey();
  // snapshot the machine settings any logged exercise was performed at
  const machines={};
  Object.keys(res).forEach(k=>{ const mk=machineKey(k); if(mk) machines[mk]=savedMachine(k); });
  const ex=S.logs.find(l=>l.date===key);
  if(ex){
    ex.results=Object.assign(ex.results||{},res); ex.name=dayPlan(new Date()).n;
    ex.sets=Object.assign(ex.sets||{},setDetail);
    ex.machines=Object.assign(ex.machines||{},machines);
  }
  else S.logs.push({date:key, week:weekNo(), name:dayPlan(new Date()).n, results:res,
                    sets:Object.keys(setDetail).length?setDetail:undefined,
                    machines:Object.keys(machines).length?machines:undefined});
  save(); closeSheet();
  const hits=Object.keys(res).filter(k=>isHit(k,res[k])).length;
  toast(`Saved · ${hits}/${n} target${n===1?'':'s'} hit`);
  render();
}

function saveProfile(){

/* =====================================================================

   Two routes: a reduced version of today, or log whatever you actually did.

  <div class="card" style="padding:14px">

    </div>
    <div class="inrow"><input type="number" inputmode="numeric" id="ez_min" placeholder="30" style="text-align:center">
    <div class="unit">min</div></div>
    <button class="btn alt sm" style="margin-top:10px" onclick="saveEasyOther()">Log it</button>
  </div>
  <div style="height:6px"></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn gh sm" onclick="closeSheet()">Cancel</button>`;
  openSheet();
}
function startEasy(){
  const plan=dayPlan(new Date());
  const half=plan.ex.slice(0, Math.max(1,Math.ceil(plan.ex.length/2)));
  closeSheet();
  wkStart({ex:half, n:plan.n+' (short)', tag:'Reduced · easy day', brief:plan.brief, easy:true,
           circuitFrom:plan.circuitFrom, half:plan.half, roxDrill:plan.roxDrill});
}
function logEasy(label, detail, results){
  const key=todayKey();
  const ex=S.logs.find(l=>l.date===key);
  if(ex){ ex.results=Object.assign(ex.results||{},results||{}); ex.name=label; ex.easy=true; ex.detail=detail; }
  else S.logs.push({date:key, week:weekNo(), name:label, detail, easy:true, results:results||{}});
  save(); closeSheet(); toast('Logged — streak kept'); render();
}
function saveEasyRun(){
  const km=parseFloat(document.getElementById('ez_km').value);
  if(!km||km<=0){ toast('Enter a distance'); return; }
  logEasy('Easy Run', km+' km', {easyrun:km});
}
function saveEasyOther(){
  const what=(document.getElementById('ez_what').value||'').trim();
  const min=parseInt(document.getElementById('ez_min').value,10);
  if(!what){ toast('What did you do?'); return; }
  logEasy(what, min?min+' min':'', {});
}

/* =====================================================================
   SESSION HISTORY — review, correct, delete.
   Without this a mistyped value is permanent: it becomes your best, then
   your target, and targets ratchet so it never comes back down.
   ===================================================================== */
function openHistory(){
  shMode='history';
  const logs=S.logs.slice().sort((a,b)=>a.date<b.date?1:-1);
  document.getElementById('shTitle').textContent='Session history';
  document.getElementById('shSub').textContent=`${logs.length} session${logs.length===1?'':'s'} logged`;
  document.getElementById('shBody').innerHTML = logs.length ? logs.map(l=>{
    const ks=Object.keys(l.results||{});
    const hits=ks.filter(k=>isHitAsOf(k,l.results[k],l.date)).length;
    const d=new Date(l.date+'T12:00:00');
    return `<div class="histrow" onclick="openSession('${l.date}')">
      <div class="dot ${l.easy?'b':hits/Math.max(1,ks.length)>=0.7?'g':'r'}"></div>
      <div style="flex:1;min-width:0">
        <div class="row-t">${l.name}${l.easy?' <span class="pill m" style="padding:2px 6px;font-size:9px">EASY</span>':''}</div>
        <div class="row-s">${longDate(d)}${l.detail?' · '+l.detail:ks.length?' · '+ks.length+' exercise'+(ks.length>1?'s':''):''}</div>
      </div>
      ${ks.length?`<span class="pill ${hits/ks.length>=0.7?'g':'r'}">${hits}/${ks.length}</span>`:''}
      <svg class="caret" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l6 6-6 6"/></svg>
    </div>`;}).join('')
    : `<div class="empty"><b>Nothing logged yet</b><p>Sessions you complete will appear here, where you can review or correct them.</p></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn alt" onclick="closeSheet()">Done</button>`;
  openSheet();
}

function openSession(date){
  const l=S.logs.find(x=>x.date===date); if(!l){ toast('Session not found'); return; }
  shMode='session'; shKeys=[date];
  const ks=Object.keys(l.results||{});
  const d=new Date(date+'T12:00:00');
  document.getElementById('shTitle').textContent=l.name;
  document.getElementById('shSub').textContent=longDate(d)+(l.easy?' · logged as an easy day':'');
  document.getElementById('shBody').innerHTML=`
  ${l.detail?`<div class="rxbox" style="color:var(--muted2);background:rgba(255,255,255,.04);border-color:var(--border)">${l.detail}</div>`:''}
  ${ks.length?ks.map(k=>{
    const e=EX[k]; if(!e) return '';
    const v=l.results[k], hit=isHitAsOf(k,v,date);
    const sets=(l.sets||{})[k];
    return `<div class="field">
      <div class="flabel"><span>${e.n}</span><span>${hit===null?'':hit?'Hit':'Missed'} · target was ${fmt(targetAsOf(k,date),e.kind)}</span></div>
      ${sets&&sets.length>1?`<div class="setsline">Sets: ${sets.map(x=>fmt(x,e.kind)).join(' · ')}</div>`:''}
      <div class="inrow">
        <input ${e.kind==='time'?'type="text" inputmode="numeric"':'type="number" inputmode="decimal" step="any"'}
          id="ed_${k}" value="${e.kind==='time'?fmt(v,'time'):v}">
        <div class="unit">${e.kind==='time'?'mm:ss':e.kind==='kg'?'kg':e.kind==='dist'?'km':'reps'}</div>
      </div>
      <div class="fb" id="edfb_${k}" style="margin-top:7px">Correct it if this is wrong</div>
    </div>`;}).join('')
   :`<p style="font-size:13px;color:var(--muted2);line-height:1.6;padding:4px 0 12px">No exercise results on this session.</p>`}
  ${(l.machines&&Object.keys(l.machines).length)?`<div class="machnote" style="margin-bottom:12px">Logged at: ${
     Object.entries(l.machines).map(([mk,v])=>MACHINES[mk]?MACHINES[mk].n+' '+Object.entries(v).map(([a,bb])=>a+' '+bb).join('/'):'').filter(Boolean).join(' · ')}</div>`:''}
  <div style="height:4px"></div>`;
  document.getElementById('shFoot').innerHTML=`
    ${ks.length?`<button class="btn" onclick="saveSessionEdit('${date}')">Save corrections</button>`:''}
    <button class="btn gh sm" style="margin-top:9px;color:var(--red);border-color:rgba(239,68,68,.35)" onclick="confirmDeleteSession('${date}')">Delete this session</button>`;
  openSheet();
}

function saveSessionEdit(date){
  const l=S.logs.find(x=>x.date===date); if(!l) return;
  const bad=[];
  const next={};
  Object.keys(l.results||{}).forEach(k=>{
    const el=document.getElementById('ed_'+k); if(!el) return;
    const v=parseVal(el.value, EX[k].kind);
    if(v==null||v<=0){ bad.push(EX[k].n+': enter a value'); return; }
    const chk=sane(k,v);
    if(!chk.ok){ bad.push(EX[k].n+': '+chk.why); return; }
    next[k]=v;
  });
  if(bad.length){ toast(bad[0]); return; }
  l.results=next;
  // a corrected value invalidates the stored per-set detail for that exercise
  if(l.sets) Object.keys(l.sets).forEach(k=>{ if(next[k]==null) delete l.sets[k]; });
  save(); closeSheet(); toast('Session corrected'); render();
}

let _delArmed=null;
function confirmDeleteSession(date){
  if(_delArmed===date){
    S.logs=S.logs.filter(x=>x.date!==date);
    _delArmed=null; save(); closeSheet(); toast('Session deleted'); render(); return;
  }
  _delArmed=date;
  toast('Tap delete again to confirm');
  setTimeout(()=>{ if(_delArmed===date)_delArmed=null; },3500);
}

function openWeight(){
  shMode='weight';
  document.getElementById('shTitle').textContent='Log body weight';
  document.getElementById('shSub').textContent=longDate(new Date());
  const last=S.weights.length?S.weights[S.weights.length-1].kg:'';
  document.getElementById('shBody').innerHTML=`
  <div class="field"><div class="flabel"><span>Weight today</span><span>${last?'Last '+last+' kg':''}</span></div>
  <div class="inrow"><input type="number" inputmode="decimal" step="0.1" id="w_kg" value="${last||''}" placeholder="78.0"><div class="unit">kg</div></div></div>
  <div style="height:6px"></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn" onclick="saveWeight()">Save</button>`;
  openSheet();
}
function saveWeight(){
  const v=parseFloat(document.getElementById('w_kg').value);
  if(!v||v<=0){ toast('Enter a weight'); return; }
  const k=todayKey(); const ex=S.weights.find(x=>x.d===k);
  if(ex)ex.kg=v; else S.weights.push({d:k,kg:v});
  S.weights.sort((a,b)=>a.d<b.d?-1:1);
  S.profile.weight=v; save(); closeSheet(); toast('Weight logged'); render();
}

/* ---------- BACKUP / RESTORE ---------- */
function backupPayload(){
  return JSON.stringify({_app:'hyrox',_v:3,_at:new Date().toISOString(),data:S},null,2);
}
let DL=null;                       // downloads capability, if this view has it
(async()=>{
  try{ if(window.claude&&claude.use) DL=await claude.use('downloads'); }catch(e){}
  // only repaint if the app has already booted and we are on a screen that shows it
  try{ if(document.getElementById('view') && tab==='profile') render(); }catch(e){}
})();

async function exportData(){
  const txt=backupPayload();
  const name='hyrox-backup-'+todayKey()+'.json';
  openBackupSheet(txt,name,!!DL);
  if(!DL) return;                  // no file save here — the sheet already explains
  try{
    await DL.save({filename:name, data:txt});
    toast('Backup saved');
    markBackedUp(); closeSheet(); render();
  }catch(e){
    const c=e&&e.code;
    if(c==='declined') toast('Save cancelled — copy it instead');
    else if(c==='rate_limited') toast('Try again in a moment');
    else toast('Could not save a file — copy it instead');
  }
}
function openBackupSheet(txt,name,dl){
  shMode='backup';
  document.getElementById('shTitle').textContent='Back up your training';
  document.getElementById('shSub').textContent=`${S.logs.length} sessions · ${S.weights.length} weigh-ins`;
  document.getElementById('shBody').innerHTML=`
  <p style="font-size:13.5px;color:var(--muted2);line-height:1.6;padding:2px 0 14px">
  ${dl?`Saving <b style="color:var(--white)">${name}</b> — confirm the prompt. If you cancel, copy the text below instead.`
      :`File saving is not available in this view. Copy the text below and keep it somewhere safe — email it to yourself, drop it in Notes, anywhere you will find it again.`}
  </p>
  <button class="btn alt sm" onclick="copyBackup()">Copy backup text</button>
  <textarea id="bkTxt" readonly style="width:100%;height:30vh;margin-top:12px;background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--muted2);font:400 11px/1.5 ui-monospace,monospace;resize:none">${txt.replace(/</g,'&lt;')}</textarea>
  <div style="height:6px"></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn" onclick="markBackedUp();closeSheet();render()">Done — saved it</button>`;
  openSheet();
}
function copyBackup(){
  const el=document.getElementById('bkTxt');
  const txt=backupPayload();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>{el.select();toast('Select all and copy')});
  } else { el.select(); toast('Select all and copy'); }
}
function openRestore(){
  shMode='restore';
  document.getElementById('shTitle').textContent='Restore from backup';
  document.getElementById('shSub').textContent='Paste a backup file here';
  document.getElementById('shBody').innerHTML=`
  <p style="font-size:13.5px;color:var(--muted2);line-height:1.6;padding:2px 0 12px">
  Paste the contents of a backup file. This <b style="color:var(--white)">replaces</b> everything currently in the app.</p>
  <textarea id="rsTxt" placeholder="Paste backup JSON here" style="width:100%;height:30vh;background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--white);font:400 11px/1.5 ui-monospace,monospace;resize:none"></textarea>
  <div class="fb" id="rsFb" style="margin-top:10px">Waiting for a backup</div>
  <div style="height:6px"></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn" onclick="doRestore()">Restore</button>`;
  openSheet();
  setTimeout(()=>{const t=document.getElementById('rsTxt');if(t)t.addEventListener('input',checkRestore);},150);
}
function parseBackup(raw){
  const o=JSON.parse(raw);
  const d = (o && o._app==='hyrox' && o.data) ? o.data : o;   // accept wrapped or bare
  if(!d || typeof d!=='object' || !Array.isArray(d.logs)) throw new Error('not a Hyrox backup');
  return d;
}
function checkRestore(){
  const el=document.getElementById('rsFb');
  const raw=document.getElementById('rsTxt').value.trim();
  if(!raw){ el.className='fb'; el.textContent='Waiting for a backup'; return; }
  try{
    const d=parseBackup(raw);
    el.className='fb g';
    el.textContent=`Valid backup — ${d.logs.length} session${d.logs.length===1?'':'s'}, ${(d.weights||[]).length} weigh-in${(d.weights||[]).length===1?'':'s'}${d.profile&&d.profile.name?', '+d.profile.name:''}`;
  }catch(e){ el.className='fb r'; el.textContent='Not a valid backup file'; }
}
function doRestore(){
  const raw=document.getElementById('rsTxt').value.trim();
  if(!raw){ toast('Paste a backup first'); return; }
  let d; try{ d=parseBackup(raw); }catch(e){ toast('Not a valid backup'); return; }
  S={profile:d.profile||{}, logs:d.logs||[], weights:d.weights||[], targets:d.targets||{}, settings:d.settings||{}};
  save(); closeSheet(); toast(`Restored ${S.logs.length} sessions`); go('home');
}
/* nudge a backup every 10 sessions */
function backupDue(){
  const n=S.logs.length;
  if(n<5) return false;
  const last=S.settings.lastBackupCount||0;
  return (n-last)>=10;
}
function markBackedUp(){ S.settings.lastBackupCount=S.logs.length; save(); }
function showRaw(txt){
  shMode='raw';
  document.getElementById('shTitle').textContent='Your data';
  document.getElementById('shSub').textContent='Select and copy';
  document.getElementById('shBody').innerHTML=`<textarea readonly style="width:100%;height:46vh;background:var(--navy);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--muted2);font:400 11px/1.5 ui-monospace,monospace;resize:none">${txt.replace(/</g,'&lt;')}</textarea><div style="height:6px"></div>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn alt" onclick="closeSheet()">Done</button>`;
  openSheet();
}
function resetAll(){
  shMode='reset';
  document.getElementById('shTitle').textContent='Reset everything?';
  document.getElementById('shSub').textContent='This cannot be undone';
  document.getElementById('shBody').innerHTML=`<p style="font-size:13.5px;color:var(--muted2);line-height:1.6;padding:4px 0 10px">Every logged session, weight entry, scaled target and your profile will be deleted. Baselines return to your original training log values.</p>`;
  document.getElementById('shFoot').innerHTML=`<button class="btn" style="background:var(--red);color:#fff" onclick="doReset()">Delete all data</button>
  <button class="btn gh sm" style="margin-top:9px" onclick="closeSheet()">Cancel</button>`;
  openSheet();
}
function doReset(){ try{localStorage.removeItem(KEY);}catch(e){} S={profile:{},logs:[],weights:[],targets:{},settings:{}}; closeSheet(); toast('All data cleared'); go('home'); }

let tt;
function toast(m){
  const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2200);
}

/* =====================================================================
   RENDER
   ===================================================================== */
const HDR={home:['Hyrox',null],train:['Train','Today'],progress:['Progress','Every exercise'],profile:['Profile','Body & coverage'],coach:['Coach','Analysis']};
function render(){
  const now=new Date();
  const h=HDR[tab];
  document.getElementById('hdrLg').textContent=h[0];
  document.getElementById('hdrSm').textContent = tab==='home' ? longDate(now) : h[1];
  document.getElementById('view').innerHTML =
    tab==='home'?vHome(): tab==='train'?vTrain(): tab==='progress'?vProgress(): tab==='profile'?vProfile(): vCoach();
  renderTabs();
}
/* header shrink on scroll — iOS large-title behaviour */
document.getElementById('scroll').addEventListener('scroll',function(){
  document.getElementById('hdr').classList.toggle('stuck', this.scrollTop>12);
},{passive:true});

/* Boot happens at the very end of the app (see part6) so that every
   function — including the workout-resume helpers — is defined first. */
</script>
